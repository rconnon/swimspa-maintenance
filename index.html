<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Vita Spa XL4 Water Manager</title>
<style>
/* ============================================================
   CSS VARIABLES — light mode is the default; dark overrides
   via prefers-color-scheme. System fonts only, no CDN.
   ============================================================ */
:root {
  color-scheme: light dark;
  --bg: #f9f9f7;            /* page plane */
  --surface: #fcfcfb;       /* cards / chart surface */
  --ink: #0b0b0b;           /* primary text */
  --ink-2: #52514e;         /* secondary text */
  --muted: #898781;         /* axis / captions */
  --hairline: #e1e0d9;      /* gridlines / dividers */
  --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;        /* interactive / series-1 blue */
  --accent-ink: #ffffff;
  /* Status palette — fixed, never used as series colors */
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --crit: #d03b3b;
  --info: #2a78d6;
  --gray-status: #898781;
  /* Soft tint backgrounds for status banners */
  --good-bg: rgba(12,163,12,0.10);
  --warn-bg: rgba(250,178,25,0.14);
  --crit-bg: rgba(208,59,59,0.10);
  --gray-bg: rgba(137,135,129,0.12);
  --info-bg: rgba(42,120,214,0.10);
  /* Chart series (validated 4-slot categorical) */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --band: rgba(42,120,214,0.10); /* target-band wash */
  --radius: 16px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --band: rgba(57,135,229,0.14);
    --good-bg: rgba(12,163,12,0.16);
    --warn-bg: rgba(250,178,25,0.14);
    --crit-bg: rgba(208,59,59,0.18);
    --gray-bg: rgba(137,135,129,0.16);
    --info-bg: rgba(57,135,229,0.16);
  }
}

/* ============ RESET / BASE ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.45;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; width: 100%; }
h1, h2, h3 { line-height: 1.2; }
svg { display: block; max-width: 100%; }

/* ============ LAYOUT ============ */
.screen { max-width: 640px; margin: 0 auto; padding: 16px 16px 24px; }
.screen-title { font-size: 22px; font-weight: 700; margin: 6px 0 14px; }
.subtitle { color: var(--ink-2); font-size: 14px; margin-top: -10px; margin-bottom: 14px; }

/* ============ CARDS ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.card h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
@media (min-width: 560px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }
.card-grid .card { margin-bottom: 0; padding: 14px; }

/* Chemistry stat tile */
.stat-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.stat-value { font-size: 26px; font-weight: 650; margin: 2px 0; }
.stat-sub { font-size: 12px; color: var(--ink-2); }
.stat-status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; margin-top: 4px; }

/* ============ STATUS BANNER ============ */
.banner { border-radius: var(--radius); padding: 18px 16px; margin-bottom: 14px; border: 1px solid var(--border); }
.banner .b-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.banner .b-why { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.banner-green { background: var(--good-bg); }
.banner-amber { background: var(--warn-bg); }
.banner-red   { background: var(--crit-bg); }
.banner-gray  { background: var(--gray-bg); }
.banner-blue  { background: var(--info-bg); }

/* Status dot + icon text */
.sdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.s-green .sdot { background: var(--good); }
.s-amber .sdot { background: var(--warn); }
.s-red .sdot { background: var(--crit); }
.s-gray .sdot { background: var(--gray-status); }
.s-blue .sdot { background: var(--info); }

/* ============ BUTTONS ============ */
.btn {
  display: block; width: 100%; text-align: center;
  padding: 15px 16px; border-radius: 14px; font-weight: 650; font-size: 16px;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--ink);
  margin-bottom: 10px;
}
.btn:active { transform: scale(0.985); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-quiet { background: none; border: none; color: var(--accent); font-size: 14px; padding: 10px; }
.btn-danger { color: var(--crit); border-color: var(--crit); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.btn[disabled] { opacity: 0.4; pointer-events: none; }

/* ============ TILES (test entry) ============ */
.tile-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.tile {
  flex: 1 0 56px; min-height: 52px; border-radius: 12px;
  border: 2px solid var(--hairline); background: var(--surface);
  font-size: 17px; font-weight: 650; position: relative;
}
.tile .tile-swatch { display: block; width: 22px; height: 6px; border-radius: 3px; margin: 4px auto 0; }
.tile.sel { border-color: var(--accent); background: var(--info-bg); }
.tile.dim { opacity: 0.35; }

/* Inline pad-color swatch shown beside logged readings (result screen,
   timeline). A between-two-colors read renders as a split swatch. */
.pad-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px;
  border: 1px solid var(--border); vertical-align: -2px; margin-right: 5px; flex: none; }
.reading-chip { display: inline-flex; align-items: center; margin: 2px 12px 2px 0; white-space: nowrap; }

/* ============ TIMER ============ */
.timer-wrap { text-align: center; padding: 30px 0; }
.timer-num { font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer-label { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.timer-warn { color: var(--ink-2); margin-top: 10px; font-size: 15px; }

/* ============ LISTS / TIMELINE ============ */
.tl-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.tl-item:last-child { border-bottom: none; }
.tl-icon { font-size: 18px; flex: none; width: 28px; text-align: center; }
.tl-body { flex: 1; min-width: 0; }
.tl-when { font-size: 12px; color: var(--muted); }
.tl-title { font-weight: 600; font-size: 15px; }
.tl-detail { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
.tl-divider { text-align: center; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 0 4px; border-top: 2px solid var(--accent); margin-top: 10px; }

/* ============ PROGRESS (fresh fill) ============ */
.prog-bar { height: 8px; border-radius: 4px; background: var(--hairline); overflow: hidden; margin: 8px 0 4px; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 4px; }
.prog-steps { list-style: none; margin: 12px 0; }
.prog-steps li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 15px; }
.prog-steps .p-mark { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; border: 2px solid var(--hairline); color: var(--muted); }
.prog-steps li.done .p-mark { background: var(--good); border-color: var(--good); color: #fff; }
.prog-steps li.current { font-weight: 700; }
.prog-steps li.current .p-mark { border-color: var(--accent); color: var(--accent); }

/* ============ FORMS / SETTINGS ============ */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
details.why { margin-top: 10px; font-size: 14px; }
details.why summary { color: var(--accent); font-weight: 600; cursor: pointer; }
details.why p { margin-top: 6px; color: var(--ink-2); }
.safety { font-size: 13px; color: var(--ink-2); background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }

/* ============ CHIPS / SEGMENTED ============ */
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--surface); font-size: 13px; font-weight: 600; }
.seg button.sel { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* ============ CHART ============ */
.chart-card { padding: 14px 8px 8px 4px; }
.chart-card h3 { padding-left: 12px; }
.chart-tip {
  position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px; font-size: 13px; max-width: 240px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.18); pointer-events: none;
}
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 6px 12px; font-size: 12px; color: var(--ink-2); }
.legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.legend .lg i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

/* ============ TAB BAR ============ */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  display: flex; background: var(--surface); border-top: 1px solid var(--hairline);
  padding-bottom: env(safe-area-inset-bottom); height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
}
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--muted); }
.tabbar button.sel { color: var(--accent); }
.tabbar .t-ico { font-size: 20px; line-height: 1; }

/* misc */
.muted { color: var(--muted); font-size: 13px; }
.spacer { height: 8px; }
.result-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 15px; }
.result-row:last-child { border-bottom: none; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.badge-green { background: var(--good-bg); color: var(--good); }
.badge-amber { background: var(--warn-bg); color: #8a6100; }
.badge-red { background: var(--crit-bg); color: var(--crit); }
.badge-gray { background: var(--gray-bg); color: var(--muted); }
.badge-blue { background: var(--info-bg); color: var(--accent); }
@media (prefers-color-scheme: dark) { .badge-amber { color: var(--warn); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" class="chart-tip" style="display:none"></div>
<script>
/* ============================================================
   VITA SPA XL4 WATER MANAGER
   Single-file, offline, no-dependency swim-spa water assistant.

   Code sections:
     1. Constants (profile, modes, targets, test kit, chemicals)
     2. Storage & state model
     3. Pure chemistry/diagnostic engine  (no DOM access — testable)
     4. Fresh-fill state machine helpers
     5. Maintenance & dynamic water-change engine
     6. Dose calculator
     7. Rendering + navigation + event handlers
     8. Charts (inline SVG, time-scaled)
     9. Import / export
    10. App initialization (guarded so this file runs under Node for tests)

   Operating philosophy: TEST → DIAGNOSE → CORRECT ONE THING →
   CIRCULATE → RETEST. Chlorine sanitizer with ozone assist; CYA is
   tracked as a first-class metric because stabilized-chlorine
   accumulation is the main reason this spa is drained every 3–4 months.
   ============================================================ */

"use strict";

/* ============================================================
   1. CONSTANTS
   ============================================================ */

const STORAGE_KEY = "vitaSpaXL4WaterManager_v1";
const APP_VERSION = 1;

const SPA_PROFILE = {
  name: "Vita Spa XL4",
  manufacturer: "Vita Spa",
  model: "XL4",
  volumeGallons: 1550,
  volumeLitres: 5867,
  sanitizerSystem: "chlorine",
  ozoneSystem: true,
  fillWater: "municipal",
  regularBathers: 3,
  maximumTypicalBathers: 7,
  typicalUsePerWeek: "2-3 sessions",
  waterChangeIntervalDays: 105
};

// Two first-class seasonal operating modes. Chemistry demand is NOT
// assumed identical between them — mode + temperature ride every test
// and session so the trend engine can compare seasons.
const MODES = {
  summer_swim: { id: "summer_swim", label: "Summer Swim / Play", defaultTemperatureF: 85,
    defaultTemperatureC: 29.4, typicalActivity: "active swimming and kids playing" },
  hot_soak:    { id: "hot_soak", label: "Fall / Winter Soak", defaultTemperatureF: 102,
    defaultTemperatureC: 38.9, typicalActivity: "soaking" }
};

// Chemistry targets — configurable defaults. CYA has zones rather than
// a single min/max: preferred, caution, and high thresholds (editable —
// there is no single universal drain number).
const SPA_TARGETS = {
  freeChlorine: { min: 3, max: 5 },
  pH:           { min: 7.2, idealMin: 7.4, idealMax: 7.6, max: 7.8 },
  alkalinity:   { min: 80, max: 120 },
  hardness:     { min: 150, max: 250 },
  cya:          { preferredMin: 20, preferredMax: 50, caution: 100, high: 150 }
};

// EasyTest 7-in-1 strip kit. Values are the discrete bottle buckets —
// the app never invents precision between them. The CYA pad has a
// native RANGE bucket ("30–50") which must be stored as a range, never
// collapsed to a midpoint.
const TEST_KITS = {
  easytest_7in1: {
    id: "easytest_7in1",
    name: "EasyTest 7-in-1 Pool & Spa Test Strips",
    entry: "discrete",
    immersionSeconds: 1,
    readDelaySeconds: 15,
    instructions: {
      dip: "Immerse the strip for about 1 second and remove. Do not shake excess water off.",
      wait: "Hold the strip horizontally for 15 seconds.",
      read: "Compare immediately in natural light."
    },
    parameters: {
      hardness:      { label: "Total Hardness", unit: "ppm", values: [0, 100, 250, 500, 1000] },
      freeChlorine:  { label: "Free Chlorine", unit: "ppm", values: [0, 0.5, 1, 3, 5, 10] },
      totalChlorine: { label: "Total Chlorine", unit: "ppm", values: [0, 0.5, 1, 3, 5, 10] },
      cya:           { label: "Cyanuric Acid", unit: "ppm",
                       values: [0, { lower: 30, upper: 50, label: "30–50" }, 100, 150, 240] },
      alkalinity:    { label: "Total Alkalinity", unit: "ppm", values: [0, 40, 80, 120, 180, 240] },
      pH:            { label: "pH", unit: "", values: [6.2, 6.8, 7.2, 7.8, 8.4, 9.0] }
    },
    padOrder: ["hardness", "freeChlorine", "totalChlorine", "cya", "alkalinity", "pH"],
    hiddenParameters: ["bromine"]
  }
};

// Approximate chart pad colors, matched to the actual EasyTest 7-in-1
// bottle chart (sampled from photos of the bottle, Aug 2026):
//   hardness: steel blue → purple · free chlorine: white → pink → purple
//   total chlorine: pale yellow-green → green · CYA: orange → salmon-pink
//   alkalinity: pale yellow → green → teal → sky blue
//   pH: mustard → orange → coral red
// Decorative hints only — the number is always shown and color is never
// the sole channel.
const PAD_COLORS = {
  hardness:      { 0:"#4e7fae", 100:"#5570b5", 250:"#8163ab", 500:"#925fa6", 1000:"#8f4d90" },
  freeChlorine:  { 0:"#f2efe7", 0.5:"#ecdcec", 1:"#e7c3e0", 3:"#dfa5d4", 5:"#cf8ac6", 10:"#a75ba0" },
  totalChlorine: { 0:"#e8e18a", 0.5:"#d8e08c", 1:"#c9dd8b", 3:"#b5d98a", 5:"#9ed489", 10:"#7fcc86" },
  cya:           { 0:"#e59a62", "30-50":"#ee9282", 100:"#f19390", 150:"#ef8e9d", 240:"#f08fa9" },
  alkalinity:    { 0:"#eee8a2", 40:"#c6e3b4", 80:"#a8dcc0", 120:"#96d5cd", 180:"#8fcde0", 240:"#7cc3ea" },
  pH:            { 6.2:"#e9b355", 6.8:"#ec9b47", 7.2:"#ec8f3f", 7.8:"#ea8440", 8.4:"#e96e4c", 9.0:"#e75f52" }
};

// Chemical inventory (all products the user already owns). Doses are
// NEVER hardcoded — a dose is only calculated once the actual
// product-label numbers are configured in Settings.
const DEFAULT_CHEMICALS = [
  { id: "piper_alk_buffer", name: "Piper Clear Alk+ Buffer", role: "alkalinity increaser",
    type: "alkalinity buffer", configured: true, purpose: "Raises total alkalinity.", dosing: null },
  { id: "piper_ph_down", name: "Piper Clear pH Down", role: "pH decreaser",
    type: "pH reducer", configured: true, purpose: "Lowers pH.", dosing: null },
  { id: "aqua_granular", name: "Aqua Granular", role: "routine sanitizer",
    type: "stabilized chlorine granules", configured: true,
    purpose: "Stabilized chlorine sanitizer — adds CYA with every dose.", dosing: null },
  { id: "piper_cal", name: "Piper Clear Cal", role: "hardness increaser",
    type: "calcium hardness increaser", configured: true, purpose: "Raises calcium hardness.", dosing: null },
  { id: "aqua_shock", name: "Aqua Shock", role: "oxidizer",
    type: "chlorinating shock", configured: true, purpose: "Chlorinating shock / oxidation.", dosing: null },
  { id: "aqua_ph_plus", name: "Aqua pH+ Plus", role: "pH increaser",
    type: "pH increaser", configured: true, purpose: "Raises pH.", dosing: null },
  { id: "easytest_7in1", name: "EasyTest 7-in-1 Test Strips", role: "testing",
    type: "test strips", configured: true, purpose: "Water testing.", dosing: null }
];

// Fresh-fill / startup state machine, in required order. cya_baseline
// records the fresh-fill CYA for longitudinal analysis — it never gates.
const STARTUP_STATES = ["refill", "initial_test", "alkalinity", "ph", "hardness",
  "chlorine", "cya_baseline", "final_test", "complete"];

const STARTUP_STEP_LABELS = {
  refill: "Refill", initial_test: "Initial test", alkalinity: "Alkalinity", ph: "pH",
  hardness: "Hardness", chlorine: "Chlorine", cya_baseline: "CYA baseline",
  final_test: "Final test", complete: "Complete"
};

const DEFAULT_INTERVALS = {
  shockDays: 7,
  filterRinseDays: 10,          // spec: every 1–2 weeks
  filterCleanDays: 30,
  filterReplaceMonths: 12,      // per manufacturer/user setting
  waterChangeDays: 105,         // nominal 3.5 months; dynamic logic can pull this in
  quickTestDays: 3,             // FC / pH freshness tolerance
  fullTestDays: 7,
  hardnessTestDays: 30
};

const PARAM_LABELS = { freeChlorine: "Free Chlorine", totalChlorine: "Total Chlorine",
  pH: "pH", alkalinity: "Alkalinity", hardness: "Hardness", cya: "CYA", combined: "Est. Combined Cl" };
// Dashboard card order (spec §10) and the order diagnose() reports in.
const DASH_ORDER = ["freeChlorine", "totalChlorine", "pH", "alkalinity", "hardness", "cya"];

const EVENT_TYPES = ["water_test", "chemical_added", "shock", "swim_session", "filter_rinse",
  "filter_clean", "filter_replace", "drain_started", "refill", "startup_complete",
  "mode_change", "ozone_change", "note"];

const DAY_MS = 24 * 60 * 60 * 1000;

/* ============================================================
   2. STORAGE & STATE MODEL
   ============================================================ */

function defaultState() {
  return {
    version: APP_VERSION,
    spaProfile: JSON.parse(JSON.stringify(SPA_PROFILE)),
    operatingMode: "summer_swim",
    ozone: { installed: true, enabled: true },
    testKit: "easytest_7in1",
    targets: JSON.parse(JSON.stringify(SPA_TARGETS)),
    chemicalInventory: JSON.parse(JSON.stringify(DEFAULT_CHEMICALS)),
    events: [],
    maintenance: {
      intervals: Object.assign({}, DEFAULT_INTERVALS),
      lastRefillDate: null
    },
    startup: { active: false, state: null },
    settings: {
      spaName: "Vita Spa XL4",
      showEventMarkers: true,
      modeTemps: { summer_swim: 85, hot_soak: 102 }   // editable per-mode default °F
    }
  };
}

let _idCounter = 0;
function makeId(prefix, timestamp) {
  _idCounter += 1;
  return prefix + "_" + timestamp.replace(/[^0-9]/g, "").slice(0, 14) + "_" + _idCounter;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // Shallow-merge onto defaults so new fields appear after upgrades.
    const base = defaultState();
    const merged = Object.assign(base, parsed);
    merged.maintenance = Object.assign(base.maintenance, parsed.maintenance || {});
    merged.maintenance.intervals = Object.assign(Object.assign({}, DEFAULT_INTERVALS), (parsed.maintenance || {}).intervals || {});
    merged.settings = Object.assign(base.settings, parsed.settings || {});
    merged.settings.modeTemps = Object.assign({ summer_swim: 85, hot_soak: 102 }, (parsed.settings || {}).modeTemps || {});
    merged.ozone = Object.assign(base.ozone, parsed.ozone || {});
    return merged;
  } catch (e) {
    return defaultState();
  }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function currentModeTemp(state) {
  return state.settings.modeTemps[state.operatingMode] ||
    MODES[state.operatingMode].defaultTemperatureF;
}

// Append an event and keep the log chronologically sorted. Water tests
// additionally record operating mode, temperature, and water-cycle id.
function addEvent(state, type, data, notes, when) {
  const ts = (when && typeof when.toISOString === "function") ? when.toISOString() : when;
  const d = new Date(ts);
  const ev = {
    id: makeId(type === "water_test" ? "test" : "ev", ts),
    timestamp: ts,
    localDate: localDateStr(d),
    localTime: localTimeStr(d),
    year: d.getFullYear(),
    type: type,
    data: data || {},
    notes: notes || ""
  };
  if (type === "water_test") {
    ev.waterCycleId = currentCycleId(state);
    if (ev.data.operatingMode == null) ev.data.operatingMode = state.operatingMode;
    if (ev.data.waterTemperatureF == null) ev.data.waterTemperatureF = currentModeTemp(state);
  }
  state.events.push(ev);
  state.events.sort((a, b) => a.timestamp < b.timestamp ? -1 : 1);
  return ev;
}

function localDateStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function localTimeStr(d) {
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/* ============================================================
   3. PURE CHEMISTRY / DIAGNOSTIC ENGINE
   Every function here is DOM-free and takes explicit inputs
   (including `now`) so it can run under Node for the test suite.
   ============================================================ */

// A stored reading value is either  { value, approximate }  or a range
// { lower, upper, approximate:true } — from "between two colors" OR the
// CYA pad's native 30–50 bucket. asInterval() gives a uniform [lo, hi]
// view. Ranges are never collapsed to midpoints in storage; midpoints
// exist only for chart geometry and trend comparison, clearly marked.
function asInterval(v) {
  if (v == null) return null;
  if (typeof v === "number") return { lo: v, hi: v, approximate: false };
  if (v.lower != null && v.upper != null) return { lo: v.lower, hi: v.upper, approximate: true };
  if (v.value != null) return { lo: v.value, hi: v.value, approximate: !!v.approximate };
  return null;
}

// Classify an interval against a [min,max] target:
//  "in" | "low" | "high" | "borderline" (interval crosses a boundary).
function rangeStatus(v, min, max) {
  const iv = asInterval(v);
  if (!iv) return "unknown";
  if (iv.lo >= min && iv.hi <= max) return "in";
  if (iv.hi < min) return "low";
  if (iv.lo > max) return "high";
  return "borderline";
}

/* ---- Free chlorine (buckets 0/0.5/1/3/5/10; target 3–5) ----
   0 → depleted, block. 0.5–1 → too low, block. 3–5 → normal.
   10 → high: block use AND do not add more sanitizer.
   Ozone reduces demand but NEVER excuses a missing residual — nothing
   here consults the ozone setting. */
function interpretFC(v, targets) {
  const t = (targets || SPA_TARGETS).freeChlorine;
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested", blocksUse: false };
  if (iv.approximate) {
    const rs = rangeStatus(v, t.min, t.max);
    if (rs === "in") return { status: "green", label: "In range", blocksUse: false };
    if (rs === "low") return { status: "red", label: "Low", blocksUse: true };
    if (rs === "high") return { status: iv.lo >= 10 ? "red" : "amber", label: "High", blocksUse: iv.lo >= 10 };
    // Ambiguous read crossing the target boundary: retest, never over-correct.
    return { status: "amber", label: "Borderline — retest", blocksUse: false, borderline: true };
  }
  const c = iv.lo;
  if (c === 0)  return { status: "red", label: "Depleted", blocksUse: true };
  if (c <= 1)   return { status: "red", label: "Too low", blocksUse: true };
  if (c >= 10)  return { status: "red", label: "High", blocksUse: true, doNotAdd: true };
  if (c >= t.min && c <= t.max) return { status: "green", label: "In range", blocksUse: false };
  if (c > t.max) return { status: "amber", label: "Above target", blocksUse: false };
  return { status: "red", label: "Too low", blocksUse: true };
}

// Total chlorine is tracked for the combined-chlorine estimate; it has
// no target band of its own and never blocks use directly.
function interpretTC(v) {
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested" };
  return { status: "blue", label: "Tracked" };
}

// Estimated combined chlorine — only computable when both reads are
// exact strip buckets; an approximate read on either side yields null
// rather than a fabricated number (strip resolution is coarse).
function combinedChlorine(fcV, tcV) {
  const fc = asInterval(fcV), tc = asInterval(tcV);
  if (!fc || !tc || fc.approximate || tc.approximate) return null;
  return Math.max(0, tc.lo - fc.lo);
}

function interpretPH(v, targets) {
  const t = (targets || SPA_TARGETS).pH;
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested" };
  const rs = rangeStatus(v, t.min, t.max);
  if (rs === "in") return { status: "green", label: "In range" };
  if (rs === "borderline") return { status: "amber", label: "Borderline — retest", borderline: true };
  if (rs === "low") return { status: iv.hi <= 6.2 ? "red" : "amber", label: "Low" };
  return { status: iv.lo >= 8.4 ? "red" : "amber", label: "High" };
}

function interpretAlkalinity(v, targets) {
  const t = (targets || SPA_TARGETS).alkalinity;
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested" };
  const rs = rangeStatus(v, t.min, t.max);
  if (rs === "in") return { status: "green", label: "In range" };
  if (rs === "borderline") return { status: "amber", label: "Borderline — retest", borderline: true };
  if (rs === "low") return { status: "amber", label: "Low" };
  return { status: iv.lo >= 240 ? "red" : "amber", label: iv.lo >= 240 ? "Very high" : "High" };
}

// Hardness (0/100/250/500/1000; target ~150–250). The strip cannot
// resolve 150–200, so 250 counts as acceptable and hardness always
// displays with the ~ approximate marker.
function interpretHardness(v, targets) {
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested" };
  if (iv.hi <= 0)   return { status: "amber", label: "Very low" };
  if (iv.hi <= 100) return { status: "amber", label: "Low" };
  if (iv.lo >= 500) return { status: "amber", label: "High" };
  return { status: "green", label: "In range" };
}

/* ---- CYA (buckets 0 / 30–50 / 100 / 150 / 240) ----
   Zones, not a single band: preferred 20–50, caution ≥100, high ≥150,
   very high ≥240. CYA never blocks same-day use, but it drives the
   dynamic water-change recommendation (stabilized chlorine accumulates
   CYA — the main reason this spa is drained every 3–4 months). */
function interpretCYA(v, targets) {
  const t = (targets || SPA_TARGETS).cya;
  const iv = asInterval(v);
  if (!iv) return { status: "gray", label: "Not tested" };
  if (iv.lo >= 240) return { status: "red", label: "Very high", zone: "very_high" };
  if (iv.lo >= t.high) return { status: "amber", label: "High", zone: "high" };
  if (iv.lo >= t.caution) return { status: "amber", label: "Elevated", zone: "caution" };
  if (iv.hi > t.caution) return { status: "amber", label: "Possibly elevated — retest", zone: "caution", borderline: true };
  if (iv.hi <= 0) return { status: "blue", label: "No stabilizer", zone: "none" };
  if (iv.hi > t.preferredMax) return { status: "amber", label: "Above preferred — watch", zone: "watch" };
  return { status: "green", label: "Good", zone: "preferred" };
}

const INTERPRETERS = { freeChlorine: interpretFC, totalChlorine: interpretTC, pH: interpretPH,
  alkalinity: interpretAlkalinity, hardness: interpretHardness, cya: interpretCYA };

function interpretParam(param, v, targets) {
  return INTERPRETERS[param](v, targets);
}

// Format a reading for display without inventing precision. The CYA
// pad's native 30–50 bucket displays as "30–50" (that IS the reading);
// between-color merges display with a ~ marker; hardness is always ~.
function formatValue(param, v) {
  const iv = asInterval(v);
  if (!iv) return "—";
  const unit = param === "pH" ? "" : " ppm";
  if (iv.approximate && iv.lo !== iv.hi) return (param === "cya" ? "" : "~") + iv.lo + "–" + iv.hi + unit;
  const prefix = (param === "hardness" || iv.approximate) ? "~" : "";
  return prefix + iv.lo + unit;
}

// Inline swatch showing the pad color the user matched during the test.
// An exact read shows its bucket color; a between-two-colors read (or a
// merged range) shows a split swatch of the outer buckets. Decorative —
// the number stays the canonical channel; empty string when no bucket
// color is known for this reading.
function padSwatchHtml(param, v, kitId) {
  const kit = TEST_KITS[kitId] || (typeof state !== "undefined" && state ? TEST_KITS[state.testKit] : null);
  const def = kit && kit.parameters ? kit.parameters[param] : null;
  const colors = PAD_COLORS[param];
  const iv = asInterval(v);
  if (!def || !colors || !iv) return "";
  const key = b => (typeof b === "number" ? String(b) : "30-50");
  // Buckets fully inside the stored interval: one for an exact read,
  // the outer pair for a between-two-colors range.
  const hit = def.values.filter(b => {
    const biv = bucketInterval(b);
    return biv.lo >= iv.lo && biv.hi <= iv.hi;
  });
  if (!hit.length) return "";
  const c1 = colors[key(hit[0])], c2 = colors[key(hit[hit.length - 1])];
  if (!c1 || !c2) return "";
  const bg = c1 === c2 ? c1 : "linear-gradient(90deg," + c1 + " 50%," + c2 + " 50%)";
  return '<span class="pad-swatch" style="background:' + bg + '" title="pad color matched on the strip"></span>';
}

/* ---------- Latest readings & freshness ---------- */

function waterTests(state) {
  return state.events.filter(e => e.type === "water_test");
}

function latestReading(state, param) {
  const tests = waterTests(state);
  for (let i = tests.length - 1; i >= 0; i--) {
    if (tests[i].data.values && tests[i].data.values[param] != null) {
      return { value: tests[i].data.values[param], test: tests[i] };
    }
  }
  return null;
}

function ageDays(iso, now) {
  return (now.getTime() - new Date(iso).getTime()) / DAY_MS;
}

// Bather-load classification (§32): 1–3 normal · 4–5 moderate/high ·
// 6–7+ high. Moderate-or-worse sessions tighten sanitizer freshness.
function loadClass(ev) {
  const b = (ev.data || {}).bathers || 0;
  if (b >= 6) return "high";
  if (b >= 4) return "moderate";
  return "normal";
}
function isHeavySession(ev) {
  return loadClass(ev) !== "normal" || (ev.data || {}).duration === "60+ min";
}

// Per-parameter freshness. A heavy session after the last sanitizer
// reading invalidates it — require fresher data before relying on it.
function paramFreshness(state, param, now) {
  const r = latestReading(state, param);
  const iv = state.maintenance.intervals;
  const tol = (param === "hardness") ? iv.hardnessTestDays
            : (param === "freeChlorine" || param === "pH") ? iv.quickTestDays
            : iv.fullTestDays;
  if (!r) return { tested: false, stale: true, days: null, toleranceDays: tol };
  const days = ageDays(r.test.timestamp, now);
  let stale = days > tol;
  if ((param === "freeChlorine" || param === "pH") && !stale) {
    const heavySince = state.events.some(e =>
      e.type === "swim_session" && e.timestamp > r.test.timestamp && isHeavySession(e));
    if (heavySince) stale = true;
  }
  return { tested: true, stale, days, toleranceDays: tol, reading: r };
}

/* ---------- Diagnostic priority engine ----------
   Priority: 1 FC safety → 2 alkalinity → 3 pH → 4 hardness →
   5 combined chlorine / shock → 6 CYA → 7 maintenance.
   One corrective chemistry action at a time: the UI surfaces the first
   action as "do this first"; info-severity notes (combined chlorine,
   CYA) ride alongside rather than being suppressed by it. Borderline
   (ambiguous range) readings recommend a retest, never a correction. */
function diagnose(values, targets, context) {
  targets = targets || SPA_TARGETS;
  const actions = [];
  const v = values || {};

  // 1. FREE CHLORINE — sanitizer safety overrides normal sequencing.
  if (v.freeChlorine != null) {
    const fc = interpretFC(v.freeChlorine, targets);
    const iv = asInterval(v.freeChlorine);
    if (fc.borderline) {
      actions.push({ priority: 1, severity: "amber", parameter: "freeChlorine",
        title: "Confirm free chlorine with a retest",
        message: "The strip read was between two colors across the target boundary. Retest before correcting.",
        blocksUse: false, retestOnly: true });
    } else if (fc.doNotAdd || (iv && iv.lo >= 10)) {
      actions.push({ priority: 1, severity: "red", parameter: "freeChlorine",
        title: "Chlorine is high",
        message: "Do not add more sanitizer. Allow the level to fall and retest before using the spa.",
        blocksUse: true, doNotAdd: true });
    } else if (fc.blocksUse) {
      actions.push({ priority: 1, severity: "red", parameter: "freeChlorine",
        title: "Restore free chlorine",
        message: iv && iv.hi <= 0 ? "Free chlorine is depleted. Do not use the spa until a residual is restored."
                                  : "Free chlorine is below the normal operating range. Restore chlorine before use.",
        blocksUse: true });
    }
  }

  // 2. ALKALINITY — corrected before pH.
  let alkConfirmedIn = false;
  if (v.alkalinity != null) {
    const rs = rangeStatus(v.alkalinity, targets.alkalinity.min, targets.alkalinity.max);
    alkConfirmedIn = rs === "in";
    if (rs === "low" || rs === "high") {
      actions.push({ priority: 2, severity: "amber", parameter: "alkalinity",
        title: "Correct alkalinity first",
        message: rs === "low" ? "Total alkalinity is low. Correct alkalinity before adjusting pH."
                              : "Total alkalinity is high. Correct alkalinity gradually before adjusting pH.",
        blocksPHAdjustment: true });
    } else if (rs === "borderline") {
      actions.push({ priority: 2, severity: "amber", parameter: "alkalinity",
        title: "Alkalinity is borderline",
        message: "The reading spans the target boundary. Retest before making any correction.",
        retestOnly: true, blocksPHAdjustment: true });
    }
  }

  // 3. pH — only once alkalinity is confirmed in range.
  if (v.pH != null) {
    const rs = rangeStatus(v.pH, targets.pH.min, targets.pH.max);
    const alkOk = v.alkalinity == null ? true : alkConfirmedIn;
    if (alkOk && (rs === "low" || rs === "high")) {
      actions.push({ priority: 3, severity: "amber", parameter: "pH",
        title: "Correct pH",
        message: rs === "low" ? "pH is below the target range." : "pH is above the target range." });
    } else if (alkOk && rs === "borderline") {
      actions.push({ priority: 3, severity: "amber", parameter: "pH",
        title: "pH is borderline", message: "Retest before correcting.", retestOnly: true });
    }
  }

  // 4. HARDNESS — informational.
  if (v.hardness != null) {
    const iv = asInterval(v.hardness);
    if (iv && iv.hi <= 100) {
      actions.push({ priority: 4, severity: "info", parameter: "hardness",
        title: "Hardness appears low",
        message: "Consider raising calcium hardness with Piper Clear Cal, using label-based dosing." });
    } else if (iv && iv.lo >= 500) {
      actions.push({ priority: 4, severity: "info", parameter: "hardness",
        title: "Hardness is high",
        message: "Do not add hardness increaser. High hardness is usually resolved at the next water change." });
    }
  }

  // 5. COMBINED CHLORINE — a soft note from one coarse reading (≥2 ppm
  // estimated); the pattern engine escalates only on repeats. This note
  // rides alongside any blocking FC action, never replaces it.
  const cc = combinedChlorine(v.freeChlorine, v.totalChlorine);
  if (cc != null && cc >= 2) {
    actions.push({ priority: 5, severity: "info", parameter: "combined",
      title: "Combined chlorine may be elevated",
      message: "Estimated combined chlorine is ~" + cc + " ppm. Evaluate sanitizer, shock status, and recent bather load. One coarse strip result is not conclusive — retest and watch the trend." });
  }

  // 6. CYA — never blocks use; drives water-change planning.
  if (v.cya != null) {
    const cy = interpretCYA(v.cya, targets);
    if (cy.zone === "very_high") {
      actions.push({ priority: 6, severity: "red", parameter: "cya",
        title: "CYA is very high",
        message: "Water replacement is likely preferable to continuing stabilized chlorine additions. Water change strongly recommended." });
    } else if (cy.zone === "high") {
      actions.push({ priority: 6, severity: "amber", parameter: "cya",
        title: "CYA is high",
        message: "Strongly consider dilution or a refill instead of continuing stabilized chlorine buildup." });
    } else if (cy.zone === "caution" && !cy.borderline) {
      actions.push({ priority: 6, severity: "info", parameter: "cya",
        title: "CYA is elevated",
        message: "Watch chlorine effectiveness and start planning water management." });
    }
  }

  return actions.sort((a, b) => a.priority - b.priority);
}

/* ---------- "Can we use it?" engine ----------
   Ozone never overrides the chlorine requirement — the ozone setting is
   deliberately absent from this function. */
function canWeUseIt(state, now) {
  if (startupInProgress(state)) {
    return { verdict: "NOT_YET", reason: "Fresh-fill setup is in progress. Finish water setup before using the spa." };
  }
  const fcFresh = paramFreshness(state, "freeChlorine", now);
  if (!fcFresh.tested) {
    return { verdict: "TEST_FIRST", reason: "No sanitizer reading yet. Test before using the spa." };
  }
  if (fcFresh.stale) {
    return { verdict: "TEST_FIRST", reason: "Your sanitizer reading is too old to rely on. Test before using the spa." };
  }
  const lastTest = fcFresh.reading.test;
  const chemAfter = state.events.some(e =>
    (e.type === "chemical_added" || e.type === "shock") && e.timestamp > lastTest.timestamp);
  if (chemAfter) {
    return { verdict: "TEST_FIRST", reason: "Chemicals were added after the last test. Circulate and retest before using the spa." };
  }
  const values = {};
  DASH_ORDER.forEach(p => { const r = latestReading(state, p); if (r) values[p] = r.value; });
  const actions = diagnose(values, state.targets);
  const blocking = actions.find(a => a.blocksUse);
  if (blocking) {
    return { verdict: "NOT_YET", reason: blocking.message || blocking.title, action: blocking };
  }
  // A borderline sanitizer read is not proof of a safe residual.
  if (actions.some(a => a.parameter === "freeChlorine" && a.retestOnly)) {
    return { verdict: "TEST_FIRST", reason: "The last free-chlorine read was between two colors across the target boundary. Retest before using the spa." };
  }
  const obs = lastTest.data.observations;
  if (obs && obs.appearance === "very cloudy") {
    return { verdict: "NOT_YET", reason: "Water was recorded as very cloudy. Resolve clarity before using the spa." };
  }
  const phFresh = paramFreshness(state, "pH", now);
  if (phFresh.stale) {
    return { verdict: "TEST_FIRST", reason: "The pH reading is out of date. Run a quick test before using the spa." };
  }
  return { verdict: "YES", reason: "Latest readings are within normal operating ranges." };
}

/* ---------- Overall Today status ---------- */
function overallStatus(state, now) {
  if (startupInProgress(state)) {
    return { color: "blue", title: "Fresh fill in progress", why: "Continue the water setup wizard to finish preparing the water." };
  }
  const fcFresh = paramFreshness(state, "freeChlorine", now);
  if (!fcFresh.tested) {
    return { color: "gray", title: "Test water first", why: "No water tests recorded yet. Run a test to see where things stand." };
  }
  if (fcFresh.stale) {
    return { color: "gray", title: "Test water first",
      why: "The sanitizer reading is " + (fcFresh.days != null ? Math.floor(fcFresh.days) + " day(s) old" : "out of date") + ". Test before relying on it." };
  }
  const values = {};
  DASH_ORDER.forEach(p => { const r = latestReading(state, p); if (r) values[p] = r.value; });
  const actions = diagnose(values, state.targets);
  const blocking = actions.find(a => a.blocksUse);
  if (blocking) {
    return { color: "red", title: "Do not use yet", why: blocking.message || blocking.title, action: blocking };
  }
  if (actions.length > 0) {
    return { color: "amber", title: "Water needs attention", why: actions[0].message || actions[0].title, action: actions[0] };
  }
  return { color: "green", title: "Water looks good", why: "Water is balanced and the latest sanitizer reading is current." };
}

/* ---------- Water age, cycles & dynamic water-change logic ---------- */
function waterAgeDays(state, now) {
  const d = state.maintenance.lastRefillDate;
  if (!d) return null;
  return Math.floor(ageDays(d, now));
}

function currentCycleId(state) {
  const d = state.maintenance.lastRefillDate;
  if (!d) return "cycle_initial";
  return "cycle_" + localDateStr(new Date(d)).replace(/-/g, "_");
}

function waterCycles(state) {
  const cycles = [];
  let current = { id: "cycle_initial", start: null, events: [] };
  state.events.forEach(ev => {
    if (ev.type === "refill") {
      if (current.events.length > 0 || current.start) cycles.push(current);
      current = { id: "cycle_" + ev.localDate.replace(/-/g, "_"), start: ev.timestamp, events: [] };
    }
    current.events.push(ev);
  });
  cycles.push(current);
  return cycles;
}

/* Dynamic water-change recommendation (§20): the calendar is only the
   baseline — CYA and water condition can pull the refill forward.
   Returns { level: "none"|"plan"|"strong"|"due", message }. */
function waterChangeAdvice(state, now) {
  const age = waterAgeDays(state, now);
  const interval = state.maintenance.intervals.waterChangeDays;
  const cyaR = latestReading(state, "cya");
  const cyaIv = cyaR ? asInterval(cyaR.value) : null;

  if (cyaIv && cyaIv.lo >= 240) {
    return { level: "due", message: "CYA is very high (~" + cyaIv.lo + " ppm). Water change strongly recommended — replacement is preferable to continuing stabilized chlorine additions." };
  }
  if (cyaIv && cyaIv.lo >= state.targets.cya.high) {
    return { level: "strong", message: "CYA is high (~" + cyaIv.lo + " ppm). Strongly consider dilution or a refill even though the water is " + (age == null ? "of unknown age" : age + " days old") + "." };
  }
  if (age != null && age >= interval) {
    return { level: "due", message: "Water change due (" + age + " / " + interval + " days)." };
  }
  // Condition flags: elevated CYA late in cycle, cloudiness, frequent corrections.
  const cyaElevated = cyaIv && cyaIv.lo >= state.targets.cya.caution;
  if (age != null && age >= 80 && cyaElevated) {
    return { level: "plan", message: "Water is " + age + " days old and CYA is elevated. Start planning a water change." };
  }
  const cutoff = new Date(now.getTime() - 30 * DAY_MS).toISOString();
  const recentChems = state.events.filter(e => e.type === "chemical_added" && e.timestamp >= cutoff).length;
  const recentCloudy = waterTests(state).filter(t => t.timestamp >= cutoff &&
    t.data.observations && ["cloudy", "very cloudy"].includes(t.data.observations.appearance)).length;
  if (age != null && age >= 60 && (recentChems >= 3 || recentCloudy >= 2)) {
    return { level: "plan", message: "Water is " + age + " days old and has needed frequent attention lately. Consider an earlier water change." };
  }
  if (age != null && age >= interval - 20) {
    return { level: "plan", message: "Water is entering the later part of its cycle (" + age + " / ~" + interval + " days)." };
  }
  return { level: "none", message: age == null ? "No refill recorded yet." : "Continue normal maintenance (" + age + " / ~" + interval + " days)." };
}

/* ---------- Cycle summaries (§43) ---------- */
function cycleSummary(cycle, targets, now) {
  const tests = cycle.events.filter(e => e.type === "water_test");
  const pct = (param) => {
    const withP = tests.filter(t => t.data.values && t.data.values[param] != null);
    if (withP.length === 0) return null;
    const inR = withP.filter(t => interpretParam(param, t.data.values[param], targets).status === "green");
    return Math.round(100 * inR.length / withP.length);
  };
  const outCounts = {};
  DASH_ORDER.forEach(p => {
    outCounts[p] = tests.filter(t => t.data.values && t.data.values[p] != null &&
      !["green", "blue", "gray"].includes(interpretParam(p, t.data.values[p], targets).status)).length;
  });
  let worst = null;
  DASH_ORDER.forEach(p => { if (outCounts[p] > 0 && (worst == null || outCounts[p] > outCounts[worst])) worst = p; });
  const cyaTests = tests.filter(t => t.data.values && t.data.values.cya != null);
  const sessions = cycle.events.filter(e => e.type === "swim_session");
  const end = now ? now.toISOString() : (cycle.events.length ? cycle.events[cycle.events.length - 1].timestamp : cycle.start);
  return {
    id: cycle.id,
    start: cycle.start,
    end: end,
    days: cycle.start ? Math.max(0, Math.floor((new Date(end).getTime() - new Date(cycle.start).getTime()) / DAY_MS)) : null,
    testCount: tests.length,
    sessionCount: sessions.length,
    highLoadCount: sessions.filter(s => loadClass(s) === "high").length,
    shockCount: cycle.events.filter(e => e.type === "shock").length,
    inRangePct: { freeChlorine: pct("freeChlorine"), pH: pct("pH"), alkalinity: pct("alkalinity") },
    cyaStart: cyaTests.length ? cyaTests[0].data.values.cya : null,
    cyaEnd: cyaTests.length ? cyaTests[cyaTests.length - 1].data.values.cya : null,
    mostOutOfRange: worst
  };
}

/* ---------- Trend direction (dashboard cards) ----------
   Interval-ordered comparison — range readings (including the CYA
   30–50 bucket) are never collapsed to midpoints. An interval is
   "higher" only when it sits entirely above the other; overlapping
   intervals compare as equal, which is the honest strip answer. */
function ivGreater(x, y) { return x.lo > y.hi; }
function trendDirection(vals) {
  const ivs = vals.map(asInterval).filter(Boolean);
  if (ivs.length < 3) return "insufficient";
  const [a, b, c] = ivs.slice(-3);
  if (ivGreater(c, a) && !ivGreater(b, c)) return "rising";
  if (ivGreater(a, c) && !ivGreater(c, b)) return "falling";
  return "stable";
}

function paramTrend(state, param) {
  const vals = waterTests(state)
    .filter(t => t.data.values && t.data.values[param] != null)
    .map(t => t.data.values[param]);
  return trendDirection(vals);
}

/* ---------- Pattern detection (deterministic, explainable) ---------- */
function detectPatterns(state, now) {
  const patterns = [];
  const tests = waterTests(state);
  const targets = state.targets;

  // Repeated low FC: 3 of the last 5 normal-context readings low.
  const normalFC = tests.filter(t => (t.data.context || "normal") === "normal" &&
    t.data.values && t.data.values.freeChlorine != null).slice(-5);
  if (normalFC.length >= 3) {
    const low = normalFC.filter(t => asInterval(t.data.values.freeChlorine).hi <= 1);
    if (low.length >= 3) {
      patterns.push({ id: "low_fc", title: "Free chlorine frequently runs low",
        detail: "At least 3 of the last 5 normal checks were below target.",
        suggestion: "Review sanitizer routine after restoring chlorine. Ozone assists but never replaces a residual." });
    }
  }

  // Post-play chlorine drop: FC normal before a high-load (6–7 bather)
  // session, low within 24h after — twice or more. One post-play low
  // reading never condemns the normal sanitizer strategy.
  let drops = 0;
  state.events.forEach(ev => {
    if (ev.type !== "swim_session" || loadClass(ev) !== "high") return;
    const before = tests.filter(t => t.timestamp < ev.timestamp && t.data.values && t.data.values.freeChlorine != null).pop();
    const after = tests.find(t => t.timestamp > ev.timestamp &&
      (new Date(t.timestamp) - new Date(ev.timestamp)) <= 24 * 3600 * 1000 &&
      t.data.values && t.data.values.freeChlorine != null);
    if (before && after &&
        interpretFC(before.data.values.freeChlorine, targets).status === "green" &&
        asInterval(after.data.values.freeChlorine).hi <= 1) drops++;
  });
  if (drops >= 2) {
    patterns.push({ id: "post_play_drop", title: "Chlorine commonly drops after high-load play sessions",
      detail: "High bather loads create a large sanitizer demand. This is expected demand, not a failing sanitizer strategy.",
      suggestion: "Check free chlorine after play dates and shock when load has been heavy." });
  }

  // CYA accumulation across the current water cycle. Compared as
  // intervals/bucket order — the 30–50 bucket is never a midpoint.
  const cid = currentCycleId(state);
  const cyaCycle = tests.filter(t => t.waterCycleId === cid && t.data.values && t.data.values.cya != null)
    .map(t => asInterval(t.data.values.cya));
  if (cyaCycle.length >= 3) {
    let nonDecreasing = true;
    for (let i = 1; i < cyaCycle.length; i++)
      if (cyaCycle[i].lo < cyaCycle[i - 1].lo || cyaCycle[i].hi < cyaCycle[i - 1].hi) nonDecreasing = false;
    // Rise is conservative: the newest reading's floor must clear the
    // first reading's ceiling by 50+ ppm — provable from the buckets.
    if (nonDecreasing && cyaCycle[cyaCycle.length - 1].lo - cyaCycle[0].hi >= 50) {
      patterns.push({ id: "cya_accumulating", title: "CYA is accumulating during this water cycle",
        detail: "Stabilized chlorine adds CYA with every dose; it only leaves with the water.",
        suggestion: "Refill planning recommended." });
    }
  }

  // Seasonal difference: enough data in both modes → compare FC-low rates.
  const byMode = mode => tests.filter(t => t.data.operatingMode === mode &&
    t.data.values && t.data.values.freeChlorine != null);
  const summer = byMode("summer_swim"), soak = byMode("hot_soak");
  if (summer.length >= 3 && soak.length >= 3) {
    const lowRate = arr => arr.filter(t => asInterval(t.data.values.freeChlorine).hi <= 1).length / arr.length;
    if (lowRate(soak) > lowRate(summer) + 0.2) {
      patterns.push({ id: "seasonal_demand", title: "Chlorine demand appears higher during hot-soak operation",
        detail: "Low free-chlorine readings are more frequent in Fall/Winter Soak mode than in Summer Swim mode.",
        suggestion: "Expect to test and dose a little more often at 102°F." });
    } else if (lowRate(summer) > lowRate(soak) + 0.2) {
      patterns.push({ id: "seasonal_demand", title: "Chlorine demand appears higher during summer play",
        detail: "Low free-chlorine readings are more frequent in Summer Swim mode.",
        suggestion: "High-load play sessions consume sanitizer quickly — test after use." });
    }
  }

  // Combined chlorine building: last 2+ full tests with estimate ≥2.
  const ccTests = tests.filter(t => t.data.values &&
    combinedChlorine(t.data.values.freeChlorine, t.data.values.totalChlorine) != null).slice(-2);
  if (ccTests.length >= 2 && ccTests.every(t =>
    combinedChlorine(t.data.values.freeChlorine, t.data.values.totalChlorine) >= 2)) {
    patterns.push({ id: "cc_buildup", title: "Combined chlorine may be building up",
      detail: "Repeated full tests show an elevated combined-chlorine estimate.",
      suggestion: "Check recent bather load, shock status, water age, and filter condition." });
  }

  // Late-cycle instability: out-of-range rate rises past ~60 days.
  const age = waterAgeDays(state, now);
  if (age != null && age >= 60) {
    const cycleTests = tests.filter(t => t.waterCycleId === cid);
    const early = [], late = [];
    cycleTests.forEach(t => {
      const tAge = ageDays(state.maintenance.lastRefillDate, new Date(t.timestamp));
      const anyOut = ["freeChlorine", "pH", "alkalinity"].some(p => t.data.values && t.data.values[p] != null &&
        !["green", "blue", "gray"].includes(interpretParam(p, t.data.values[p], targets).status));
      (tAge >= 60 ? late : early).push(anyOut);
    });
    const rate = arr => arr.length ? arr.filter(Boolean).length / arr.length : 0;
    if (late.length >= 3 && early.length >= 3 && rate(late) > rate(early) + 0.2) {
      patterns.push({ id: "late_cycle", title: "Water is becoming harder to maintain late in the cycle",
        detail: "Out-of-range results have increased past 60 days of water age.",
        suggestion: "Consider whether the next water change should come earlier." });
    }
  }

  return patterns;
}

/* ============================================================
   6. DOSE CALCULATOR — label data only, never hardcoded doses.
   ============================================================ */
function computeDose(product, spaProfile) {
  if (!product || !product.dosing || !product.dosing.labelDose || !product.dosing.referenceVolume) return null;
  const d = product.dosing;
  const scaled = d.labelDose * spaProfile.volumeLitres / d.referenceVolume;
  return {
    amount: Math.round(scaled * 10) / 10,
    unit: d.unit || "g",
    note: "Scaled from the product label (" + d.labelDose + " " + (d.unit || "g") +
          " per " + d.referenceVolume + " L) for " + spaProfile.volumeLitres + " L."
  };
}

function findChemical(state, roleOrId) {
  return state.chemicalInventory.find(c => c.id === roleOrId) ||
         state.chemicalInventory.find(c => c.role === roleOrId);
}

/* ---------- Maintenance due calculations ---------- */
function lastEventOf(state, type) {
  for (let i = state.events.length - 1; i >= 0; i--) if (state.events[i].type === type) return state.events[i];
  return null;
}

function maintenanceStatus(state, now) {
  const iv = state.maintenance.intervals;
  const item = (type, intervalDays, label) => {
    const last = lastEventOf(state, type);
    if (!last) return { type, label, last: null, dueInDays: null, overdue: false };
    const days = ageDays(last.timestamp, now);
    return { type, label, last, lastDays: Math.floor(days), dueInDays: Math.ceil(intervalDays - days), overdue: days >= intervalDays };
  };
  return {
    shock: item("shock", iv.shockDays, "Oxidation / shock"),
    rinse: item("filter_rinse", iv.filterRinseDays, "Filter rinse"),
    clean: item("filter_clean", iv.filterCleanDays, "Deep filter clean"),
    replace: item("filter_replace", iv.filterReplaceMonths * 30.4, "Filter replacement"),
    water: Object.assign({ ageDays: waterAgeDays(state, now), intervalDays: iv.waterChangeDays },
      waterChangeAdvice(state, now))
  };
}

/* ---------- Cloudy water / foam logic (§37) ---------- */
function cloudyWaterAdvice(state, now) {
  const fc = latestReading(state, "freeChlorine");
  const fcStatus = fc ? interpretFC(fc.value, state.targets) : null;
  if (!fcStatus || fcStatus.blocksUse || fcStatus.status !== "green") {
    return { first: "Restore sanitizer first.", contributors: [] };
  }
  const contributors = [];
  const sessions = state.events.filter(e => e.type === "swim_session" &&
    ageDays(e.timestamp, now) <= 3 && isHeavySession(e));
  if (sessions.length) contributors.push("Recent high bather load");
  const m = maintenanceStatus(state, now);
  if (m.shock.overdue || !m.shock.last) contributors.push("Shock due");
  if (m.rinse.overdue || m.rinse.last == null) contributors.push("Filter due for cleaning");
  const ph = latestReading(state, "pH");
  if (ph && interpretPH(ph.value, state.targets).status !== "green") contributors.push("pH out of range");
  const hd = latestReading(state, "hardness");
  if (hd && interpretHardness(hd.value, state.targets).status !== "green") contributors.push("Hardness out of range");
  const age = waterAgeDays(state, now);
  if (age != null && age >= 60) contributors.push("Water age (" + age + " days)");
  const cy = latestReading(state, "cya");
  if (cy && ["caution", "high", "very_high"].includes(interpretCYA(cy.value, state.targets).zone))
    contributors.push("Elevated CYA");
  return { first: null, contributors };
}

const STATUS_ICON = { green: "✓", amber: "⚠", red: "✕", gray: "?", blue: "ℹ", info: "ℹ" };
const STATUS_WORD = { green: "In range", amber: "Attention", red: "Issue", gray: "Not tested", blue: "Info" };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function statusBadge(status, label) {
  const cls = { green: "badge-green", amber: "badge-amber", red: "badge-red", gray: "badge-gray", blue: "badge-blue", info: "badge-blue" }[status] || "badge-gray";
  return '<span class="badge ' + cls + '">' + STATUS_ICON[status] + " " + esc(label || STATUS_WORD[status]) + "</span>";
}

function fmtDate(iso, withTime) {
  const d = new Date(iso);
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  let s = months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  if (withTime) {
    let h = d.getHours(), ampm = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    s += " · " + h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ampm;
  }
  return s;
}

function agoStr(iso, now) {
  const days = Math.floor(ageDays(iso, now));
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  return days + " days ago";
}

/* ---------- Router ---------- */
function go(route) {
  ui.route = route;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const app = document.getElementById("app");
  let body = "";
  if (ui.testFlow) body = viewTestFlow();
  else if (ui.sessionFlow) body = viewSessionFlow();
  else if (ui.waterChange) body = viewWaterChange();
  else if (state.startup.active && ui.route === "freshfill") body = viewFreshFill();
  else {
    switch (ui.route) {
      case "today": body = viewToday(); break;
      case "test": body = viewTestStart(); break;
      case "maintenance": body = viewMaintenance(); break;
      case "history": body = viewHistory(); break;
      case "settings": body = viewSettings(); break;
      default: body = viewToday();

  app.innerHTML = '<div class="screen">' + body + "</div>" + viewTabBar();
  bindCharts();
}

function chemCard(param, now) {
  const r = latestReading(state, param);
  const info = r ? interpretParam(param, r.value, state.targets) : { status: "gray", label: "Not tested" };
  const trend = paramTrend(state, param);
  const trendTxt = { rising: "↑ rising", falling: "↓ falling", stable: "→ stable", insufficient: "" }[trend];
  const t = state.targets[param];
  let targetTxt = "";
  if (param === "cya") targetTxt = "Prefer " + t.preferredMin + "–" + t.preferredMax + " ppm";
  else if (param === "totalChlorine") targetTxt = "For combined-Cl estimate";
  else if (t) targetTxt = "Target " + (param === "hardness" ? "~" : "") + t.min + "–" + t.max + (param === "pH" ? "" : " ppm");
  const fresh = paramFreshness(state, param, now);
  return '<div class="card s-' + info.status + '">' +
    '<div class="stat-label">' + PARAM_LABELS[param] + "</div>" +
    '<div class="stat-value">' + (r ? formatValue(param, r.value) : "—") + "</div>" +
    '<div class="stat-sub">' + targetTxt + "</div>" +
    '<div class="stat-sub">' + (r ? "Tested " + agoStr(r.test.timestamp, now) + (fresh.stale ? " · retest due" : "") : "No reading") + "</div>" +
    (trendTxt ? '<div class="stat-sub">' + trendTxt + "</div>" : "") +
    '<div class="stat-status s-' + info.status + '"><span class="sdot"></span>' + esc(info.label) + "</div></div>";
}

function actionCard(now) {
  const values = {};
  DASH_ORDER.forEach(p => { const r = latestReading(state, p); if (r) values[p] = r.value; });
  const actions = diagnose(values, state.targets);
  const m = maintenanceStatus(state, now);
  let html = '<div class="card"><h3>What should I do?</h3>';
  if (actions.length > 0) {
    const a = actions[0];
    const r = a.parameter !== "combined" ? latestReading(state, a.parameter) : null;
    html += '<div class="tl-title">Do this first: ' + esc(a.title) + "</div>" +
      '<div class="tl-detail">' + esc(a.message || "") + "</div>" +
      (r ? '<div class="stat-sub" style="margin-top:6px">Current: ' + formatValue(a.parameter, r.value) + "</div>" : "") +
      whyBlock(a.parameter);
    if (!a.retestOnly && !a.doNotAdd && ["alkalinity", "pH", "hardness", "freeChlorine"].includes(a.parameter)) {
      html += '<button class="btn" style="margin-top:10px" data-act="chem-action" data-arg="' + a.parameter + '">VIEW ACTION</button>';
    }
    if (a.parameter !== "combined" && a.parameter !== "cya") {
      html += '<button class="btn-quiet" data-act="retest" data-arg="' + a.parameter + '">Retest ' + PARAM_LABELS[a.parameter] + "</button>";
    }
    // Info-severity notes (combined chlorine, CYA) ride alongside.
    const extras = actions.slice(1).filter(x => x.severity === "info" || x.parameter === "cya");
    extras.forEach(x => {
      html += '<div class="tl-detail" style="margin-top:8px">' + STATUS_ICON[x.severity === "red" ? "red" : x.severity === "amber" ? "amber" : "blue"] +
        " <b>" + esc(x.title) + ":</b> " + esc(x.message || "") + "</div>";
    });
  } else {
    const fcFresh = paramFreshness(state, "freeChlorine", now);
    const fullDue = !waterTests(state).some(t => t.data.testType === "full" && ageDays(t.timestamp, now) <= state.maintenance.intervals.fullTestDays);
    if (!fcFresh.tested || fcFresh.stale) html += '<div class="tl-detail">Run a water test — the sanitizer reading is not current.</div>';
    else if (fullDue) html += '<div class="tl-detail">Weekly full water test is due (includes CYA — it drives refill timing).</div>';
    else if (m.water.level === "due" || m.water.level === "strong") html += '<div class="tl-detail">' + esc(m.water.message) + "</div>";
    else if (m.shock.overdue || !m.shock.last) html += '<div class="tl-detail">Weekly shock/oxidation is due.</div>';
    else if (m.rinse.overdue) html += '<div class="tl-detail">Filter rinse is due.</div>';
    else if (m.water.level === "plan") html += '<div class="tl-detail">' + esc(m.water.message) + "</div>";
    else html += '<div class="tl-detail">Nothing urgent. Next: quick test in ' +
      Math.max(0, Math.ceil(state.maintenance.intervals.quickTestDays - (fcFresh.days || 0))) + " day(s).</div>";
  }
  return html + "</div>";
}

function whyBlock(param) {
  const why = {
    alkalinity: "Alkalinity helps stabilize pH. If alkalinity is out of range, pH can be difficult to control.",
    pH: "Proper pH protects bathers, equipment, and sanitizer effectiveness.",
    freeChlorine: "Free chlorine is the sanitizer residual keeping the water sanitary. Ozone helps, but never replaces a measurable residual.",
    hardness: "Adequate calcium hardness protects the shell and equipment from corrosive water.",
    cya: "Stabilizer (CYA) protects chlorine but accumulates with every stabilized dose — it only leaves with the water. Rising CYA is the main reason this spa is drained every 3–4 months.",
    combined: "Combined chlorine is spent sanitizer bound to contaminants; shock oxidizes it away."
  }[param];
  return why ? '<details class="why"><summary>Why am I doing this?</summary><p>' + esc(why) + "</p></details>" : "";
}

function maintenanceSnapshot(now) {
  const m = maintenanceStatus(state, now);
  let html = '<div class="card"><h3>Maintenance</h3>';
  html += '<div class="result-row"><span>Water age</span><span>' +
    (m.water.ageDays == null ? '<span class="muted">no refill recorded</span>' :

    (m.shock.last ? agoStr(m.shock.last.timestamp, now) + (m.shock.overdue ? " · " + statusBadge("amber", "due") : "") : statusBadge("gray", "never")) + "</span></div>";
  html += '<div class="result-row"><span>Filter rinse</span><span>' +

  const lastTest = waterTests(state).pop();
  html += '<div class="result-row"><span>Last test</span><span>' +
    (lastTest ? fmtDate(lastTest.timestamp, true) : statusBadge("gray", "never")) + "</span></div>";

}

    '<div class="card"><h3>Full test</h3><p class="tl-detail">Hardness + free & total chlorine + CYA + alkalinity + pH. Weekly — CYA drives refill timing.</p>' +
