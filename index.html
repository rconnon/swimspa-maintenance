    '<div class="card"><h3>Fresh fill test</h3><p class="tl-detail">Testing new fill water? Use the guided fresh-fill setup instead.</p>' +
    '<button class="btn" style="margin-top:10px" data-act="freshfill-start">START FRESH-FILL SETUP</button></div>' +
    '<p class="muted">EasyTest 7-in-1 procedure: immerse 1 second, do not shake, hold horizontally 15 seconds, compare in natural light. The bromine pad is ignored — this spa uses chlorine.</p>';
}

function startTest(mode, retestParam, context, onSave) {
  const kit = TEST_KITS[state.testKit];
  let params;
  if (mode === "retest") params = [retestParam];
  else if (mode === "quick") params = ["freeChlorine", "pH"];
  else params = kit.padOrder.slice();
  ui.testFlow = {
    mode, params, kit, step: "prepare", secondsLeft: kit.readDelaySeconds,
    values: {}, between: {}, context: context || "normal", observations: {},
    onSave: onSave || null
  };
  render();
}

function viewTestFlow() {
  const f = ui.testFlow;
  const title = f.mode === "retest" ? "Retest " + PARAM_LABELS[f.params[0]] :
    f.mode === "quick" ? "Quick check" : "Full test";
  let html = '<h1 class="screen-title">' + title + "</h1>";
  if (f.step === "prepare") {
    html += '<div class="card"><div class="tl-title">Test your water</div>' +
      '<p class="tl-detail" style="margin-top:6px">Grab one EasyTest strip.</p></div>' +
      '<button class="btn btn-primary" data-act="test-step" data-arg="dip">I’M READY</button>' +
      '<button class="btn-quiet" data-act="test-cancel">Cancel</button>';
  } else if (f.step === "dip") {
    html += '<div class="card"><div class="tl-title">Immerse the strip for 1 second and remove.</div>' +
      '<p class="tl-detail" style="margin-top:6px">Do not shake excess water off.</p></div>' +
      '<button class="btn btn-primary" data-act="test-step" data-arg="timer">I DIPPED IT</button>' +
      '<button class="btn-quiet" data-act="test-cancel">Cancel</button>';
  } else if (f.step === "timer") {
    const done = f.secondsLeft <= 0;
    html += '<div class="timer-wrap">' +
      '<div class="timer-label">' + (done ? "Match your strip now" : "Hold strip horizontally") + "</div>" +
      '<div class="timer-num">' + (done ? "✓" : "00:" + String(f.secondsLeft).padStart(2, "0")) + "</div>" +
      '<div class="timer-warn">' + (done ? "Compare immediately in natural light." : "Do not shake excess water off.") + "</div></div>" +
      (done ? '<button class="btn btn-primary" data-act="test-step" data-arg="entry">READ THE STRIP</button>' :
        '<button class="btn" disabled>Reading in ' + f.secondsLeft + "s…</button>");
  } else if (f.step === "entry") {
    html += '<p class="subtitle">Match your strip to the bottle chart. Numbers are what count — colors are just a hint.</p>';
    f.params.forEach(p => { html += entryTiles(p); });
    if (f.mode !== "retest") html += contextPicker() + observationsPicker();
    const complete = f.params.every(p => f.values[p] != null);
    html += '<p class="muted">Recorded with mode ' + esc(MODES[state.operatingMode].label) + " · " +
      currentModeTemp(state) + "°F</p>" +
      '<button class="btn btn-primary" ' + (complete ? "" : "disabled ") + 'data-act="test-save">SAVE TEST</button>' +
      '<button class="btn-quiet" data-act="test-cancel">Cancel</button>';
  }
  return html;
}

// A kit bucket can be a plain number or a native range object (the CYA
// 30–50 pad). Never parseFloat a range bucket — that would fabricate an
// exact value the strip cannot provide.
function bucketInterval(b) {
  return typeof b === "number" ? { lo: b, hi: b } : { lo: b.lower, hi: b.upper };
}
function bucketLabel(b) {
  return typeof b === "number" ? String(b) : b.label;
}

function entryTiles(param) {
  const f = ui.testFlow;
  const def = f.kit.parameters[param];
  const vals = def.values;
  const between = f.between[param];
  const cur = f.values[param];
  let html = '<div class="card"><h3>' + esc(def.label) + (def.unit ? " (" + def.unit + ")" : "") + "</h3>" +
    '<div class="tile-group">';
  vals.forEach((b, i) => {
    const biv = bucketInterval(b);
    let cls = "tile";
    if (between) {
      if (cur && cur.approximate && biv.lo >= cur.lower && biv.hi <= cur.upper) cls += " sel";
      else if (f._betweenFirst && f._betweenFirst.param === param) {
        if (i === f._betweenFirst.idx) cls += " sel";
        else if (Math.abs(i - f._betweenFirst.idx) !== 1) cls += " dim";
      }
    } else if (cur && !f.between[param]) {
      const civ = asInterval(cur);
      if (civ && civ.lo === biv.lo && civ.hi === biv.hi) cls += " sel";
    }
    const pad = (PAD_COLORS[param] || {})[typeof b === "number" ? b : "30-50"];
    html += '<button class="' + cls + '" data-act="tile" data-param="' + param + '" data-idx="' + i + '">' + bucketLabel(b) +
      (pad ? '<span class="tile-swatch" style="background:' + pad + '"></span>' : "") + "</button>";
  });
  html += "</div>" +
    '<button class="btn-quiet" data-act="between" data-param="' + param + '">' +
    (between ? "✓ Between two colors — tap the two adjacent values" : "Looks between two colors") + "</button>";
  if (cur) html += '<div class="stat-sub">Selected: <b>' + formatValue(param, cur) + "</b></div>";
  return html + "</div>";
}

function contextPicker() {
  const f = ui.testFlow;
  const opts = [["normal", "Normal / no recent use"], ["before_use", "Before use"], ["after_use", "After use"],
    ["after_chemicals", "After chemicals"], ["fresh_fill", "Fresh fill"]];
  return '<div class="card"><h3>Test context</h3><div class="seg">' + opts.map(o =>
    '<button data-act="ctx" data-arg="' + o[0] + '" class="' + (f.context === o[0] ? "sel" : "") + '">' + o[1] + "</button>").join("") + "</div></div>";
}

function observationsPicker() {
  const f = ui.testFlow;
  const groups = [
    ["appearance", "Water appearance", ["clear", "slightly cloudy", "cloudy", "very cloudy"]],
    ["foam", "Foam", ["none", "minor", "persistent"]],
    ["odor", "Odor", ["normal", "strong chlorine-like smell", "musty/unusual"]],
    ["surface", "Surface", ["normal", "slippery", "scale visible"]]
  ];
  return '<details class="why" style="margin-bottom:12px"><summary>Optional observations</summary>' +
    groups.map(g => '<div class="card" style="margin-top:8px"><h3>' + g[1] + '</h3><div class="seg">' +
      g[2].map(o => '<button data-act="obs" data-group="' + g[0] + '" data-arg="' + o + '" class="' +
        (f.observations[g[0]] === o ? "sel" : "") + '">' + o + "</button>").join("") + "</div></div>").join("") + "</details>";
}

function startTimer() {
  const f = ui.testFlow;
  f.secondsLeft = f.kit.readDelaySeconds;
  f.step = "timer";
  render();
  const tick = setInterval(() => {
    if (!ui.testFlow || ui.testFlow.step !== "timer") { clearInterval(tick); return; }
    ui.testFlow.secondsLeft -= 1;
    if (ui.testFlow.secondsLeft <= 0) {
      clearInterval(tick);
      ui.testFlow.secondsLeft = 0;
      try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) { /* ignore */ }
    }
    render();
  }, 1000);
}

function saveTestFlow() {
  const f = ui.testFlow;
  const now = new Date();
  const values = {};
  f.params.forEach(p => {
    const v = f.values[p];
    if (v == null) return;
    if (v.approximate && v.lower != null) values[p] = { lower: v.lower, upper: v.upper, approximate: true };
    else values[p] = { value: v.value, approximate: p === "hardness" };
  });
  const data = {
    testType: f.mode === "retest" ? "retest" : f.mode,
    context: f.context,
    testKit: f.kit.id,
    precision: "discrete-strip",
    operatingMode: state.operatingMode,
    waterTemperatureF: currentModeTemp(state),
    values: values
  };
  if (Object.keys(f.observations).length) data.observations = f.observations;
  const ev = addEvent(state, "water_test", data, "", now);
  saveState(state);
  const cb = f.onSave;
  ui.testFlow = null;
  ui.lastResult = ev;
  if (cb) { cb(ev); return; }
  ui.route = "result";
  renderResult(ev);
}

function renderResult(ev) {
  const values = ev.data.values;
  const actions = diagnose(values, state.targets, ev.data.context);
  let rows = "";
  DASH_ORDER.forEach(p => {
    if (values[p] == null) return;
    const info = interpretParam(p, values[p], state.targets);
    rows += '<div class="result-row"><span>' + PARAM_LABELS[p] + "</span><span>" +
      padSwatchHtml(p, values[p], ev.data.testKit) + "<b>" + formatValue(p, values[p]) + "</b> " +
      statusBadge(info.status, info.label) + "</span></div>";
  });
  const cc = combinedChlorine(values.freeChlorine, values.totalChlorine);
  if (cc != null) {
    rows += '<div class="result-row"><span>Est. combined chlorine</span><span><b>~' + cc + " ppm</b> " +
      statusBadge(cc >= 2 ? "amber" : "green", cc >= 2 ? "Elevated" : "OK") + "</span></div>";
  }
  let html = '<h1 class="screen-title">Test complete</h1><div class="card">' + rows + "</div>";
  if (ev.data.context === "after_use" && values.freeChlorine && interpretFC(values.freeChlorine, state.targets).blocksUse) {
    html += '<div class="card"><div class="tl-detail">This reading was taken after use — a sanitizer dip after a busy session is expected demand. Restore chlorine, but one post-use low reading doesn\'t mean the normal sanitizer strategy is inadequate.</div></div>';
  }
  if (actions.length > 0) {
    const a = actions[0];
    html += '<div class="card"><h3>Do this first</h3><div class="tl-title">' + esc(a.title) + "</div>" +
      '<div class="tl-detail">' + esc(a.message || "") + "</div>" + whyBlock(a.parameter);
    if (!a.retestOnly && !a.doNotAdd && ["alkalinity", "pH", "hardness", "freeChlorine"].includes(a.parameter))
      html += '<button class="btn btn-primary" style="margin-top:10px" data-act="chem-action" data-arg="' + a.parameter + '">VIEW ACTION</button>';
    if (a.parameter !== "combined" && a.parameter !== "cya")
      html += '<button class="btn-quiet" data-act="retest" data-arg="' + a.parameter + '">RETEST ' + PARAM_LABELS[a.parameter].toUpperCase() + "</button>";
    // Surface additional notes (e.g. combined chlorine alongside a blocking FC).
    actions.slice(1).forEach(x => {
      html += '<div class="tl-detail" style="margin-top:8px">' + STATUS_ICON[x.severity === "red" ? "red" : x.severity === "amber" ? "amber" : "blue"] +
        " <b>" + esc(x.title) + ":</b> " + esc(x.message || "") + "</div>";
    });
    html += "</div>";
  } else {
    html += '<div class="banner banner-green"><div class="b-title">✓ All readings look good</div></div>';
  }
  html += '<button class="btn" data-act="nav" data-arg="today">DONE</button>';
  document.getElementById("app").innerHTML = '<div class="screen">' + html + "</div>" + viewTabBar();
}

/* ============================================================
   CHEMICAL ACTION SCREEN
   ============================================================ */
function viewChemAction(param) {
  const r = latestReading(state, param);
  const t = state.targets[param];
  const rs = r && t && t.min != null ? rangeStatus(r.value, t.min, t.max) : "unknown";
  // High alkalinity must never surface the increaser (§24): it is
  // lowered gradually per the configured procedure, not dosed up.
  const alkHigh = param === "alkalinity" && rs === "high";
  const roleNeeded = param === "alkalinity" ? (alkHigh ? null : "alkalinity increaser") :
    param === "pH" ? (rs === "low" ? "pH increaser" : "pH decreaser") :
    param === "hardness" ? "hardness increaser" : "routine sanitizer";
  const product = roleNeeded ? findChemical(state, roleNeeded) : null;
  const dose = product ? computeDose(product, state.spaProfile) : null;
  const vol = state.spaProfile.volumeLitres.toLocaleString() + " L / " + state.spaProfile.volumeGallons + " US gallons";
  let html = '<h1 class="screen-title">Correct ' + PARAM_LABELS[param].toLowerCase() + "</h1>" +
    '<div class="card">' +
    '<div class="result-row"><span>Current</span><b>' + (r ? formatValue(param, r.value) : "—") + "</b></div>" +
    (t && t.min != null ? '<div class="result-row"><span>Target</span><b>' + t.min + "–" + t.max + (param === "pH" ? "" : " ppm") + "</b></div>" : "") +
    '<div class="result-row"><span>Product</span><b>' + (alkHigh ? "— (lowering procedure)" : product ? esc(product.name) : "Not configured") + "</b></div>" +
    '<div class="result-row"><span>Dose</span><span>' + (alkHigh ?
      "Alkalinity is high — <b>do not add alkalinity increaser</b>. Lower it gradually per your configured procedure: small adjustments, circulate, retest between each." :
      dose ? "<b>" + dose.amount + " " + esc(dose.unit) + "</b><br><span class='muted'>" + esc(dose.note) + "</span>" :
      "Follow the product label for approximately <b>" + vol + "</b>.") + "</span></div></div>";
  if (param === "freeChlorine") {
    html += '<div class="card"><div class="tl-detail">Aqua Granular is stabilized chlorine — every dose also adds CYA. That\'s normal, and it\'s why CYA is tracked on every full test.</div></div>';
  }
  html += '<div class="card"><h3>Then</h3><ol style="padding-left:20px;font-size:14px">' +
    "<li>Circulate the water according to the product label.</li>" +
    "<li>Wait the label’s recommended time.</li>" +
    "<li>Retest " + PARAM_LABELS[param].toLowerCase() + ".</li>" +
    (param === "alkalinity" ? "<li>Only then evaluate pH.</li>" : "") + "</ol>" + whyBlock(param) + "</div>";
  html += '<div class="safety">Never premix spa chemicals or combine concentrated chemicals together. Add products separately and follow the product label. Keep chemicals secured away from children — chemical handling is an adult task.</div>' +
    '<div class="spacer"></div>' +
    '<button class="btn btn-primary" data-act="chem-added" data-param="' + param + '" data-product="' + (product ? product.id : "") + '">I ADDED IT</button>' +
    '<button class="btn" data-act="retest" data-arg="' + param + '">RETEST</button>' +
    '<button class="btn-quiet" data-act="nav" data-arg="today">CANCEL</button>';
  document.getElementById("app").innerHTML = '<div class="screen">' + html + "</div>" + viewTabBar();
}

/* ============================================================
   4/7. FRESH FILL WIZARD — state machine lives in state.startup and
   persists on every transition so reopening resumes exactly here.

function setStartupState(s) {
  state.startup.state = s;
  // "complete" keeps the wizard active so the completion screen renders;
  // only ffFinish() (START NORMAL MAINTENANCE) deactivates the wizard
  // and records the startup_complete event.
  state.startup.active = s != null;
  saveState(state);
}

// True while the wizard still has balance work to do. The "complete"
// state shows a summary screen but no longer restricts spa use.
function startupInProgress(state) {
  return state.startup.active && state.startup.state !== "complete";
}

function freshFillProgress() {
  const steps = STARTUP_STATES.slice(0, 8); // exclude "complete"
  const curIdx = STARTUP_STATES.indexOf(state.startup.state);
  const doneCount = Math.min(curIdx, 8);
  let html = '<div class="prog-bar"><div class="prog-fill" style="width:' + Math.round(100 * doneCount / 8) + '%"></div></div>' +
    '<div class="muted">' + doneCount + ' of 8 steps</div><ul class="prog-steps">';
  steps.forEach((s, i) => {
    const cls = i < curIdx ? "done" : i === curIdx ? "current" : "";
    const mark = i < curIdx ? "✓" : i === curIdx ? "●" : "○";
    html += '<li class="' + cls + '"><span class="p-mark">' + mark + "</span>" + STARTUP_STEP_LABELS[s] + "</li>";
  });
  return html + "</ul>";
}

function viewFreshFill() {
  const s = state.startup.state;

    '<div class="card">' + freshFillProgress() + "</div>";

      '<button class="btn btn-primary" data-act="ff-finish">START NORMAL MAINTENANCE</button>';

  html += '<button class="btn-quiet" data-act="nav" data-arg="today">Back to Today</button>';

// One balance step: evaluate latest reading → good/continue or correct/retest.
function freshFillBalanceStep(step, now) {
  const param = step === "ph" ? "pH" : step === "chlorine" ? "freeChlorine" : step;
  const t = state.targets[param];
  const r = latestReading(state, param);
  const rs = r && t && t.min != null ? rangeStatus(r.value, t.min, t.max) : "unknown";
  const label = PARAM_LABELS[param];
  let html = '<div class="card"><h3>Current task</h3>';

  if (step === "chlorine") {
    const fc = r ? interpretFC(r.value, state.targets) : null;
    // Overshot during establishment: never advise adding more (Rule 4/5).
    const ivHigh = r ? asInterval(r.value) : null;
    if (ivHigh && ivHigh.lo >= 10) {
      html += '<div class="tl-title">Free chlorine is high (' + formatValue("freeChlorine", r.value) + ")</div>" +
        '<p class="tl-detail" style="margin:8px 0"><b>Do not add more sanitizer.</b> Circulate, allow the level to fall, and retest before continuing.</p></div>' +
        '<button class="btn btn-primary" data-act="ff-retest" data-param="freeChlorine">RETEST FREE CHLORINE</button>';
      return html;
    }
    if (fc && fc.status === "green") {
      html += '<div class="banner banner-green" style="margin:0"><div class="b-title">✓ Chlorine established</div>' +
        '<div class="b-why">Free chlorine: ' + formatValue("freeChlorine", r.value) + '. Ozone assists from here, but keep a measurable residual.</div></div></div>' +
        '<button class="btn btn-primary" data-act="ff-advance" data-arg="cya_baseline">CONTINUE</button>';
      return html;
    }
    html += '<div class="tl-title">Establish free chlorine</div>' +
      '<p class="tl-detail" style="margin:8px 0">Target 3–5 ppm using <b>Aqua Granular</b> (stabilized chlorine). Ozone should be running if normally enabled — it reduces demand but never replaces the residual.</p>' +
      doseLine("routine sanitizer") +
      '<div class="safety">Never premix spa chemicals. Add products separately and follow the product label.</div></div>' +
      '<button class="btn" data-act="ff-added" data-param="freeChlorine" data-product="aqua_granular">I ADDED CHLORINE</button>' +
      '<button class="btn btn-primary" data-act="ff-retest" data-param="freeChlorine">RETEST FREE CHLORINE</button>';
    return html;
  }

  if (rs === "in" || (step === "hardness" && r && interpretHardness(r.value, state.targets).status === "green")) {
    html += '<div class="banner banner-green" style="margin:0"><div class="b-title">✓ ' + label + " looks good</div>" +
      '<div class="b-why">' + label + ": " + formatValue(param, r.value) +
      (param === "pH" ? ". No pH chemical required." : "") + "</div></div></div>" +
      '<button class="btn btn-primary" data-act="ff-advance" data-arg="' + nextStartupState(step) + '">CONTINUE</button>';
    return html;
  }

  const dir = rs === "low" ? "low" : rs === "high" ? "high" : rs;
  html += '<div class="tl-title">' + label + " is " + (r ? formatValue(param, r.value) : "not tested yet") + "</div>" +
    (t && t.min != null ? '<div class="stat-sub">Target: ' + t.min + "–" + t.max + (param === "pH" ? "" : " ppm") + "</div>" : "");

  if (step === "alkalinity") {
    html += '<p class="tl-detail" style="margin:8px 0"><b>Correct alkalinity first.</b> Alkalinity helps stabilize pH — correcting pH first means chasing the reading.</p>' +
      // High TA never shows increaser guidance (§24): lowering only.
      (dir === "high" ?
        '<div class="tl-detail">Alkalinity is high — <b>do not add alkalinity increaser</b>. Lower it gradually per your configured procedure: small adjustments, circulate, retest between each.</div>' :
        doseLine("alkalinity increaser")) + "</div>" +
      (dir !== "high" ? '<button class="btn" data-act="ff-added" data-param="alkalinity" data-product="piper_alk_buffer">I ADDED ALK+ BUFFER</button>' : "") +
      '<button class="btn btn-primary" data-act="ff-retest" data-param="alkalinity">RETEST ALKALINITY</button>' +
      '<button class="btn-quiet" data-act="ff-skip" data-arg="' + nextStartupState(step) + '">Skip for now</button>';
  } else if (step === "ph") {
    html += '<p class="tl-detail" style="margin:8px 0">Correct pH before continuing. Adjust → circulate → retest. A new reading closes this step.</p>' +
      doseLine(dir === "low" ? "pH increaser" : "pH decreaser") + "</div>" +
      '<button class="btn" data-act="ff-added" data-param="pH" data-product="' + (dir === "low" ? "aqua_ph_plus" : "piper_ph_down") + '">I ADDED pH ' + (dir === "low" ? "PLUS" : "DOWN") + "</button>" +
      '<button class="btn btn-primary" data-act="ff-retest" data-param="pH">RETEST pH</button>' +
      '<button class="btn-quiet" data-act="ff-skip" data-arg="' + nextStartupState(step) + '">Skip for now</button>';
  } else if (step === "hardness") {
    const iv = r ? asInterval(r.value) : null;
    if (iv && iv.lo >= 500) {
      html += '<p class="tl-detail" style="margin:8px 0">Hardness is high. <b>Do not add hardness increaser.</b> High hardness is usually addressed at the next water change.</p></div>' +
        '<button class="btn btn-primary" data-act="ff-advance" data-arg="chlorine">CONTINUE</button>';
    } else {
      html += '<p class="tl-detail" style="margin:8px 0">Hardness appears low. Use <b>Piper Clear Cal</b> with label-based dosing only.</p>' +
        doseLine("hardness increaser") + "</div>" +
        '<button class="btn" data-act="ff-added" data-param="hardness" data-product="piper_cal">I ADDED PIPER CLEAR CAL</button>' +
        '<button class="btn btn-primary" data-act="ff-retest" data-param="hardness">RETEST HARDNESS</button>' +
        '<button class="btn-quiet" data-act="ff-skip" data-arg="chlorine">Skip for now</button>';
    }
  }
  return html;
}

function doseLine(role) {
  const product = findChemical(state, role);
  const dose = product ? computeDose(product, state.spaProfile) : null;
  const vol = state.spaProfile.volumeLitres.toLocaleString() + " L / " + state.spaProfile.volumeGallons.toLocaleString() + " gallons";
  if (dose) return '<div class="tl-detail"><b>' + esc(product.name) + ":</b> " + dose.amount + " " + esc(dose.unit) +
    ' <span class="muted">(' + esc(dose.note) + ")</span></div>";
  if (product) return '<div class="tl-detail">Use <b>' + esc(product.name) + "</b> — follow the product label for " + vol + ". You can configure the label dose in Settings.</div>";
  return '<div class="tl-detail">No product configured. Use the product label for ' + vol + ".</div>";
}

function nextStartupState(s) {
  return STARTUP_STATES[STARTUP_STATES.indexOf(s) + 1];
}

function finalCheckTable() {
  let rows = "";
  DASH_ORDER.forEach(p => {
    const r = latestReading(state, p);
    if (!r) return;
    const info = interpretParam(p, r.value, state.targets);
    rows += '<div class="result-row"><span>' + PARAM_LABELS[p] + "</span><span>" +
      padSwatchHtml(p, r.value, r.test.data.testKit) + "<b>" + formatValue(p, r.value) + "</b> " +
      statusBadge(info.status, info.label) + "</span></div>";
  });
  return rows;
}

// Fresh-fill flow actions --------------------------------------------------
function ffCirculating() {
  const now = new Date();
  state.maintenance.lastRefillDate = now.toISOString();
  addEvent(state, "refill", {}, "", now);
  setStartupState("initial_test");
  render();
}

function ffAfterInitialTest(ev) {
  // Never dump all corrections at once — the wizard walks alkalinity →
  // pH → hardness → chlorine → CYA baseline one at a time from here.
  setStartupState("alkalinity");
  ui.route = "freshfill";
  render();
}

function ffRetest(param) {
  startTest("retest", param, "fresh_fill", function (ev) {
    ui.route = "freshfill";
    maybeAdvanceAfterRetest(param);
    render();
  });
}

function maybeAdvanceAfterRetest(param) {
  // A step closes on an acceptable NEW reading, never on "I added it".
  const s = state.startup.state;
  const r = latestReading(state, param);
  if (!r) return;
  if (s === "alkalinity" && param === "alkalinity" &&
      rangeStatus(r.value, state.targets.alkalinity.min, state.targets.alkalinity.max) === "in") setStartupState("ph");
  else if (s === "ph" && param === "pH" &&
      rangeStatus(r.value, state.targets.pH.min, state.targets.pH.max) === "in") setStartupState("hardness");
  else if (s === "hardness" && param === "hardness" &&
      interpretHardness(r.value, state.targets).status === "green") setStartupState("chlorine");
  // chlorine and cya_baseline advance via their own screens.
}

// Decide where the wizard goes after the final verification test:
// "complete" only when every correctable reading is acceptable; otherwise
// back to the earliest failing balance step (alkalinity → pH → hardness →
// chlorine). CYA is deliberately excluded — it isn't correctable by a
// wizard step (only dilution) and the baseline step records, never gates.
function finalTestOutcome(values, targets) {
  const actions = diagnose(values, targets, "fresh_fill")
    .filter(a => ["alkalinity", "pH", "hardness", "freeChlorine"].includes(a.parameter));
  if (actions.length === 0) return "complete";
  const stepFor = { alkalinity: "alkalinity", pH: "ph", hardness: "hardness", freeChlorine: "chlorine" };
  const first = ["alkalinity", "pH", "hardness", "freeChlorine"].find(p => actions.some(a => a.parameter === p));
  return stepFor[first] || "final_test";
}

function ffFinalTest() {
  startTest("full", null, "fresh_fill", function (ev) {
    const next = finalTestOutcome(ev.data.values, state.targets);
    setStartupState(next);
    if (next !== "complete") {
      alert2("Final check found " + STARTUP_STEP_LABELS[next].toLowerCase() + " out of range — returning to that step.");
    }
    ui.route = "freshfill";
    render();
  });
}

function ffFinish() {
  const now = new Date();
  addEvent(state, "startup_complete", {}, "", now);
  state.startup.active = false;
  state.startup.state = null;
  saveState(state);
  go("today");
}

/* ============================================================
   8. CHARTS — inline SVG, time-scaled x axis, no libraries.
   Discrete strip values plot exactly as recorded; range readings
   (including the native CYA 30–50 bucket) render as a range bar with a
   hollow midpoint marker — placement only, storage stays a range.
   Out-of-range points are diamonds so shape, not just color, carries
   the distinction. Estimated combined chlorine is a derived series,
   computed only from tests where both chlorine reads are exact.
   ============================================================ */

const CHART_PARAMS = ["freeChlorine", "totalChlorine", "combined", "pH", "alkalinity", "hardness", "cya"];

const CHART_Y = {
  freeChlorine:  (maxSeen) => [0, 10],
  totalChlorine: (maxSeen) => [0, 10],
  combined:      (maxSeen) => [0, Math.max(4, Math.ceil(maxSeen))],
  pH:            () => [6.2, 9.0],
  alkalinity:    () => [0, 240],
  hardness:      (maxSeen) => [0, Math.max(500, maxSeen)],
  cya:           (maxSeen) => [0, Math.max(240, maxSeen)]
};

function chartTicks(param, dom) {
  if (param === "pH") return [6.2, 6.8, 7.2, 7.8, 8.4, 9.0];
  if (param === "freeChlorine" || param === "totalChlorine") return [0, 1, 3, 5, 10];
  if (param === "combined") return [0, 1, 2, 3].filter(v => v <= dom[1]);
  if (param === "alkalinity") return [0, 80, 120, 180, 240];
  if (param === "cya") return [0, 50, 100, 150, 240];
  return [0, 100, 250, 500].filter(v => v <= dom[1]);
}

const EVENT_GLYPHS = { swim_session: "🏊", shock: "⚡", chemical_added: "🧪", filter_rinse: "🧽",
  filter_clean: "🧼", refill: "💧", mode_change: "🔄", ozone_change: "🫧" };

// Point collection: real parameters read stored values; the combined
// series is computed per test (null when either read is approximate).
function chartPoints(param, tests) {
  if (param === "combined") {
    return tests.map(t => {
      if (!t.data.values) return null;
      const cc = combinedChlorine(t.data.values.freeChlorine, t.data.values.totalChlorine);
      if (cc == null) return null;
      return { t: new Date(t.timestamp).getTime(), v: cc, test: t, derived: true };
    }).filter(Boolean);
  }
  return tests.filter(t => t.data.values && t.data.values[param] != null)
    .map(t => ({ t: new Date(t.timestamp).getTime(), v: t.data.values[param], test: t }));
}

function chartPointStatus(param, v, targets) {
  if (param === "combined") return v >= 2 ? "amber" : "green";
  if (param === "totalChlorine") return "green";   // no band of its own
  return interpretParam(param, v, targets).status;
}

function svgTrendChart(param, tests, events, targets, now) {
  const pts = chartPoints(param, tests);
  if (pts.length === 0) return '<p class="muted" style="padding:0 12px 8px">No ' + PARAM_LABELS[param].toLowerCase() + " data in this range yet.</p>";
  const W = 600, H = 210, L = 42, R = 12, T = 14, B = 34;
  const t0 = Math.min.apply(null, pts.map(p => p.t)), t1 = Math.max.apply(null, pts.map(p => p.t));
  const span = Math.max(t1 - t0, DAY_MS);
  const x = tm => L + (W - L - R) * ((tm - t0) / span);
  const maxSeen = Math.max.apply(null, pts.map(p => { const iv = asInterval(p.v); return iv ? iv.hi : p.v; }));
  const dom = CHART_Y[param](maxSeen);
  const y = v => T + (H - T - B) * (1 - (v - dom[0]) / (dom[1] - dom[0]));
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + PARAM_LABELS[param] + ' trend chart">';

  // Target bands. CYA gets three visually distinct zones instead of one
  // band: preferred (wash), caution ≥100, high ≥150 (deeper washes).
  const bandRect = (lo, hi, fill, label2) => {
    if (hi <= dom[0] || lo >= dom[1]) return "";
    const yTop = y(Math.min(hi, dom[1])), yBot = y(Math.max(lo, dom[0]));
    return '<rect x="' + L + '" y="' + yTop + '" width="' + (W - L - R) + '" height="' + (yBot - yTop) + '" fill="' + fill + '"/>' +
      (label2 ? '<text x="' + (L + 4) + '" y="' + (yTop + 11) + '" font-size="9" fill="var(--muted)">' + label2 + "</text>" : "");
  };
  if (param === "cya") {
    const ct = targets.cya;
    s += bandRect(ct.preferredMin, ct.preferredMax, "var(--band)", "preferred " + ct.preferredMin + "–" + ct.preferredMax);
    s += bandRect(ct.caution, ct.high, "rgba(250,178,25,0.12)", "caution ≥" + ct.caution);
    s += bandRect(ct.high, dom[1], "rgba(208,59,59,0.10)", "high ≥" + ct.high);
  } else if (param !== "totalChlorine" && param !== "combined") {
    const t = targets[param];
    if (t && t.min != null) s += bandRect(t.min, t.max, "var(--band)", "target " + t.min + "–" + t.max);
  }

  chartTicks(param, dom).forEach(v => {
    s += '<line x1="' + L + '" y1="' + y(v) + '" x2="' + (W - R) + '" y2="' + y(v) + '" stroke="var(--hairline)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(v) + 3) + '" font-size="10" text-anchor="end" fill="var(--muted)" font-variant-numeric="tabular-nums">' + v + "</text>";
  });
  const label = tm => { const d = new Date(tm); return (d.getMonth() + 1) + "/" + d.getDate(); };
  [t0, (t0 + t1) / 2, t1].forEach((tm, i) => {
    if (span <= DAY_MS && i !== 0) return;
    s += '<text x="' + x(tm) + '" y="' + (H - B + 16) + '" font-size="10" text-anchor="middle" fill="var(--muted)">' + label(tm) + "</text>";
  });

  if (state.settings.showEventMarkers && events) {
    events.filter(e => EVENT_GLYPHS[e.type])
      .forEach(e => {
        const tm = new Date(e.timestamp).getTime();
        if (tm < t0 - DAY_MS / 2 || tm > t1 + DAY_MS / 2) return;
        s += '<line x1="' + x(tm) + '" y1="' + T + '" x2="' + x(tm) + '" y2="' + (H - B) + '" stroke="var(--hairline)" stroke-width="1" opacity="0.7"/>' +
          '<text x="' + x(tm) + '" y="' + (H - B + 30) + '" font-size="10" text-anchor="middle">' + EVENT_GLYPHS[e.type] + "</text>";
      });
  }

  const mid = p => { const iv = asInterval(p.v); return iv ? (iv.lo + iv.hi) / 2 : p.v; };
  if (pts.length > 1) {
    s += '<path d="' + pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(mid(p)).toFixed(1)).join(" ") +
      '" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(p => {
    const iv = asInterval(p.v);
    const st = chartPointStatus(param, p.v, targets);
    const cx = x(p.t), out = !["green", "blue", "gray"].includes(st);
    const tip = tooltipData(param, p, now);
    if (iv && iv.approximate && iv.lo !== iv.hi) {
      s += '<line x1="' + cx + '" y1="' + y(iv.lo) + '" x2="' + cx + '" y2="' + y(iv.hi) + '" stroke="var(--series-1)" stroke-width="2"/>' +
        '<circle cx="' + cx + '" cy="' + y(mid(p)) + '" r="5" fill="var(--surface)" stroke="var(--series-1)" stroke-width="2" data-tip="' + tip + '"/>';
    } else if (out) {
      const cy = y(mid(p));
      s += '<rect x="' + (cx - 5) + '" y="' + (cy - 5) + '" width="10" height="10" transform="rotate(45 ' + cx + " " + cy +
        ')" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" data-tip="' + tip + '"/>';
    } else {
      s += '<circle cx="' + cx + '" cy="' + y(mid(p)) + '" r="4.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" data-tip="' + tip + '"/>';
    }
    s += '<circle cx="' + cx + '" cy="' + y(mid(p)) + '" r="14" fill="transparent" data-tip="' + tip + '"/>';
  });
  s += "</svg>";
  return s + '<div class="legend"><span class="lg"><i style="background:var(--series-1)"></i>' +
    (param === "combined" ? "estimate" : "reading") + '</span>' +
    '<span class="lg">◆ out of range</span><span class="lg">○ range read</span></div>';
}

// Tooltip payload for a chart point: value, status, context, mode/temp,
// water age at test time, and the nearest preceding event.
function tooltipData(param, p, now) {
  const test = p.test;
  const valueTxt = p.derived ? "~" + p.v + " ppm" : formatValue(param, p.v);
  const statusTxt = p.derived ? (p.v >= 2 ? "Elevated" : "OK") : interpretParam(param, p.v, state.targets).label;
  let age = "";
  if (state.maintenance.lastRefillDate && test.timestamp >= state.maintenance.lastRefillDate) {
    age = Math.floor(ageDays(state.maintenance.lastRefillDate, new Date(test.timestamp))) + " days";
  }
  const prev = state.events.filter(e => e.type !== "water_test" && e.timestamp < test.timestamp).pop();
  let prevTxt = "";
  if (prev) {
    const hrs = Math.round((new Date(test.timestamp) - new Date(prev.timestamp)) / 3600000);
    if (hrs <= 72) prevTxt = eventTitle(prev) + " · " + hrs + "h earlier";
  }
  const modeTxt = (MODES[test.data.operatingMode] || {}).label || "";
  const obj = {
    when: fmtDate(test.timestamp, true), param: PARAM_LABELS[param],
    value: valueTxt, status: statusTxt,
    context: (test.data.context || "normal").replace(/_/g, " ") +
      (modeTxt ? " · " + modeTxt + " · " + (test.data.waterTemperatureF || "?") + "°F" : ""),
    age: age, prev: prevTxt
  };
  return esc(JSON.stringify(obj));
}

// Tooltip fields round-trip through JSON.parse, so they arrive unescaped
// and can carry user-entered text. Escape every field before innerHTML.
function tooltipHtml(d) {
  return "<b>" + esc(d.when) + "</b><br>" + esc(d.param) + ": <b>" + esc(d.value) + "</b> — " + esc(d.status) +
    "<br>Context: " + esc(d.context) + (d.age ? "<br>Water age: " + esc(d.age) : "") +
    (d.prev ? "<br><span class='muted'>Previous event: " + esc(d.prev) + "</span>" : "");
}

function bindCharts() {
  if (bindCharts._done) return;
  bindCharts._done = true;
  const tip = document.getElementById("tip");
  document.addEventListener("click", function (e) {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el) { tip.style.display = "none"; return; }
    const d = JSON.parse(el.getAttribute("data-tip"));
    tip.innerHTML = tooltipHtml(d);
    tip.style.display = "block";
    const r = el.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - 250, Math.max(8, r.left - 60)) + "px";
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 10) + "px";
  });
}

function eventTitle(ev) {
  switch (ev.type) {
    case "water_test": {
      const tt = ev.data.testType;
      const ctx = ev.data.context;
      const pre = ctx === "after_use" ? "Post-use " : ctx === "fresh_fill" ? "Fresh-fill " : "";
      return pre + (tt === "quick" ? "quick test" : tt === "retest" ? "retest" : "full water test");
    }
    case "chemical_added": return "Added " + (ev.data.productName || "chemical");
    case "shock": return "Shock completed";
    case "swim_session": return (ev.data.bathersLabel || ev.data.bathers) + " bathers · " +
      (ev.data.sessionType || "") + " · " + (ev.data.duration || "");
    case "filter_rinse": return "Filters rinsed";
    case "filter_clean": return "Filters deep cleaned";
    case "filter_replace": return "Filters replaced";
    case "drain_started": return "Draining started";
    case "refill": return "Refilled spa";
    case "startup_complete": return "Water setup complete";
    case "mode_change": return "Mode → " + ((MODES[ev.data.to] || {}).label || ev.data.to);
    case "ozone_change": return "Ozone " + (ev.data.enabled ? "enabled" : "disabled");
    case "note": return "Note";
    default: return ev.type;
  }
}

// Rich reading chips for logged tests: each parameter shows the pad
// color the user matched on the strip beside the number.
function testValuesHtml(ev) {
  const short = { freeChlorine: "FC", totalChlorine: "TC", pH: "pH", alkalinity: "TA", hardness: "CH", cya: "CYA" };
  let s = '<div class="tl-detail">';
  DASH_ORDER.forEach(p => {
    if (ev.data.values[p] == null) return;
    s += '<span class="reading-chip">' + padSwatchHtml(p, ev.data.values[p], ev.data.testKit) +
      short[p] + " " + esc(formatValue(p, ev.data.values[p]).replace(" ppm", "")) + "</span>";
  });
  s += "</div>";
  const extra = [];
  const modeTxt = (MODES[ev.data.operatingMode] || {}).label;
  if (modeTxt) extra.push(modeTxt + " · " + (ev.data.waterTemperatureF || "?") + "°F");
  if (ev.data.observations) {
    const o = ev.data.observations;
    const flags = Object.keys(o).filter(k => !["clear", "none", "normal"].includes(o[k])).map(k => o[k]);
    if (flags.length) extra.push(flags.join(", "));
  }
  if (extra.length) s += '<div class="tl-detail">' + esc(extra.join(" · ")) + "</div>";
  return s;
}

function eventDetail(ev) {
  if (ev.type === "swim_session") {
    const cls = loadClass(ev);
    return (cls !== "normal" ? cls + " load · " : "") + (ev.data.waterTemperatureF || "?") + "°F";

  return "";
}

function trendRangeTests(range, now) {
  let tests = waterTests(state);
  if (range === "cycle") {
    const cid = currentCycleId(state);
    tests = tests.filter(t => t.waterCycleId === cid);
  } else if (range === "prev") {
    // Previous water cycle (§43): the cycle immediately before the
    // most recent refill.
    const cycles = waterCycles(state);
    const prev = cycles.length >= 2 ? cycles[cycles.length - 2] : null;
    tests = prev ? prev.events.filter(e => e.type === "water_test") : [];
  } else if (range !== "all") {
    const days = { "7d": 7, "30d": 30, "90d": 90, "1y": 365 }[range];
    const cutoff = new Date(now.getTime() - days * DAY_MS).toISOString();
    tests = tests.filter(t => t.timestamp >= cutoff);
  }
  return tests;
}

function viewTrends() {
  const now = new Date();
  const ranges = [["7d", "7 days"], ["30d", "30 days"], ["90d", "90 days"], ["cycle", "Water cycle"], ["prev", "Previous cycle"], ["1y", "1 year"], ["all", "All"]];
  const tests = trendRangeTests(ui.trendRange, now);
  const allTests = waterTests(state);
  let html = '<div class="seg">' + ranges.map(r =>
    '<button data-act="trend-range" data-arg="' + r[0] + '" class="' + (ui.trendRange === r[0] ? "sel" : "") + '">' + r[1] + "</button>").join("") + "</div>";

  html += trendSummaryCard(now);

  if (allTests.length < 2) {
    html += '<div class="card"><p class="tl-detail">Keep testing — trend insights will appear after several readings.</p></div>';
    return html;
  }

  html += '<div class="seg"><button data-act="toggle-markers" class="' + (state.settings.showEventMarkers ? "sel" : "") + '">' +
    (state.settings.showEventMarkers ? "✓ " : "") + "Show events</button></div>";

  CHART_PARAMS.forEach(p => {
    html += '<div class="card chart-card"><h3>' + PARAM_LABELS[p] +
      (ui.trendRange === "cycle" ? " — current water cycle" : "") + "</h3>" +
      (p === "combined" ? '<p class="muted" style="padding:0 12px">Estimated from total − free; only shown where both reads are exact.</p>' : "") +
      svgTrendChart(p, tests, state.events, state.targets, now) + "</div>";
  });

  // Water-cycle summaries & comparison.
  const cycles = waterCycles(state).filter(c => c.start || c.events.length);
  if (cycles.length) {
    html += '<div class="card"><h3>Water cycles</h3>';
    cycles.slice().reverse().forEach((c, idx) => {
      const isCurrent = idx === 0;
      const sum = cycleSummary(c, state.targets, isCurrent ? now : null);
      html += '<div style="padding:8px 0;border-bottom:1px solid var(--hairline)">' +
        '<div class="tl-title">' + (isCurrent ? "Current cycle" : "Cycle") + (c.start ? " · " + fmtDate(c.start) : " · before first recorded refill") +
        (sum.days != null ? " · " + sum.days + " days" : "") + "</div>" +
        '<div class="tl-detail">' + sum.testCount + " tests · " + sum.sessionCount + " sessions (" +
        sum.highLoadCount + " high-load) · " + sum.shockCount + " shocks</div>";
      const pcts = [];
      ["freeChlorine", "pH", "alkalinity"].forEach(p => {
        if (sum.inRangePct[p] != null) pcts.push(PARAM_LABELS[p] + " in range " + sum.inRangePct[p] + "%");
      });
      if (pcts.length) html += '<div class="tl-detail">' + pcts.join(" · ") + "</div>";
      if (sum.cyaStart != null || sum.cyaEnd != null) {
        html += '<div class="tl-detail">CYA: started ' + (sum.cyaStart != null ? formatValue("cya", sum.cyaStart) : "—") +
          " · now " + (sum.cyaEnd != null ? formatValue("cya", sum.cyaEnd) : "—") + "</div>";
      }
      if (sum.mostOutOfRange) html += '<div class="tl-detail">Most common issue: ' + PARAM_LABELS[sum.mostOutOfRange].toLowerCase() + " out of range</div>";
      html += "</div>";
    });
    html += "</div>";
  }
  return html;
}

function trendSummaryCard(now) {
  const cutoff = new Date(now.getTime() - 30 * DAY_MS).toISOString();
  const tests = waterTests(state).filter(t => t.timestamp >= cutoff);
  const patterns = detectPatterns(state, now);
  if (tests.length < 3 && patterns.length === 0) {
    return '<div class="card"><h3>Last 30 days</h3><p class="tl-detail">Keep testing — trend insights will appear after several readings.</p></div>';
  }
  let goods = [], warns = [];
  ["freeChlorine", "pH", "alkalinity", "hardness", "cya"].forEach(p => {
    const withP = tests.filter(t => t.data.values && t.data.values[p] != null);
    if (withP.length < 2) return;
    const out = withP.filter(t => !["green", "blue", "gray"].includes(interpretParam(p, t.data.values[p], state.targets).status));
    if (out.length === 0) goods.push(PARAM_LABELS[p] + " has stayed in range");
    else warns.push(PARAM_LABELS[p] + " was out of range on " + out.length + " of " + withP.length + " tests");
  });
  let html = '<div class="card"><h3>Last 30 days</h3>';
  goods.forEach(g => { html += '<div class="tl-detail">✓ ' + esc(g) + "</div>"; });
  warns.forEach(w => { html += '<div class="tl-detail">⚠ ' + esc(w) + "</div>"; });
  patterns.forEach(p => {
    html += '<div style="margin-top:8px"><div class="tl-title">Pattern detected: ' + esc(p.title.toLowerCase()) + "</div>" +
      '<div class="tl-detail">' + esc(p.detail) + " " + esc(p.suggestion || "") + "</div></div>";
  });
  return html + "</div>";
}

   ============================================================ */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "xl4-backup-" + localDateStr(new Date()) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.events)) {
        alert2("That file doesn't look like an XL4 backup."); return;
      }
      // Persist raw, then reload through loadState() so imports get the
      // same defensive default-merging as startup.
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      state = loadState();
      go("today");
    } catch (e) { alert2("Could not read that file."); }
  };
  reader.readAsText(file);
}

// Non-blocking notice (avoids native alert(), which can freeze automation).
function alert2(msg) {
  const d = document.createElement("div");
  d.className = "chart-tip";
  d.style.display = "block"; d.style.left = "16px"; d.style.right = "16px"; d.style.top = "16px"; d.style.pointerEvents = "auto";
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

/* ============================================================
   EVENT DELEGATION — every interactive element carries data-act.
   ============================================================ */
function handleAction(act, el) {
  const arg = el.getAttribute("data-arg");
  const now = new Date();
  switch (act) {
    case "nav": go(arg); break;
    case "canuse": {
      const r = canWeUseIt(state, now);
      const cls = r.verdict === "YES" ? "banner-green" : r.verdict === "TEST_FIRST" ? "banner-gray" : "banner-red";
      const word = r.verdict === "YES" ? "YES ✓" : r.verdict === "TEST_FIRST" ? "TEST FIRST" : "NOT YET";
      document.getElementById("app").innerHTML = '<div class="screen">' +
        '<h1 class="screen-title">Can we use it?</h1>' +
        '<div class="banner ' + cls + '"><div class="b-title">' + word + '</div><div class="b-why">' + esc(r.reason) + "</div></div>" +
        (r.verdict === "TEST_FIRST" ? '<button class="btn btn-primary" data-act="test-begin" data-arg="quick">QUICK TEST NOW</button>' : "") +
        (r.verdict === "NOT_YET" && r.action && r.action.parameter === "freeChlorine" && !r.action.doNotAdd ?
          '<button class="btn btn-primary" data-act="chem-action" data-arg="freeChlorine">VIEW ACTION</button>' : "") +
        '<button class="btn" data-act="nav" data-arg="today">BACK</button></div>' + viewTabBar();
      break;
    }
    case "test-begin": startTest(arg === "quick" ? "quick" : "full"); break;
    case "test-step":
      if (arg === "dip") { ui.testFlow.step = "dip"; render(); }
      else if (arg === "timer") startTimer();
      else if (arg === "entry") { ui.testFlow.step = "entry"; render(); }
      break;
    case "test-cancel": ui.testFlow = null; render(); break;
    case "test-save": saveTestFlow(); break;
    case "tile": {
      // Tiles address kit buckets BY INDEX — never parseFloat, because
      // the CYA pad's "30–50" bucket is a range object, and collapsing
      // it to a number would fabricate precision the strip lacks.
      const f = ui.testFlow, param = el.getAttribute("data-param");
      const idx = parseInt(el.getAttribute("data-idx"), 10);
      const vals = f.kit.parameters[param].values;
      const b = vals[idx], biv = bucketInterval(b);
      if (f.between[param]) {
        if (f._betweenFirst && f._betweenFirst.param === param) {
          const first = vals[f._betweenFirst.idx], fiv = bucketInterval(first);
          if (Math.abs(f._betweenFirst.idx - idx) === 1) {
            f.values[param] = { lower: Math.min(fiv.lo, biv.lo), upper: Math.max(fiv.hi, biv.hi), approximate: true };
            f._betweenFirst = null;
          } else { f._betweenFirst = { param, idx }; }
        } else { f._betweenFirst = { param, idx }; f.values[param] = null; }
      } else if (typeof b === "number") {
        f.values[param] = { value: b, approximate: false };
      } else {
        // Native range bucket (CYA 30–50): stored as a range, as-is.
        f.values[param] = { lower: b.lower, upper: b.upper, approximate: true };
      }
      render(); break;
    }
    case "between": {
      const f = ui.testFlow, param = el.getAttribute("data-param");
      f.between[param] = !f.between[param];
      f.values[param] = null; f._betweenFirst = null;
      render(); break;
    }
    case "ctx": ui.testFlow.context = arg; render(); break;
    case "obs": {
      const g = el.getAttribute("data-group");
      ui.testFlow.observations[g] = ui.testFlow.observations[g] === arg ? undefined : arg;
      if (ui.testFlow.observations[g] === undefined) delete ui.testFlow.observations[g];
      render(); break;
    }
    case "retest": startTest("retest", arg); break;
    case "retest-quick": startTest("quick", null, "after_use"); break;
    case "chem-action": viewChemAction(arg); break;
    case "chem-added": {
      const param = el.getAttribute("data-param");
      const prod = findChemical(state, el.getAttribute("data-product"));
      addEvent(state, "chemical_added", { parameter: param, productId: prod ? prod.id : null,
        productName: prod ? prod.name : "chemical" }, "", now);
      saveState(state);
      startTest("retest", param, "after_chemicals");
      break;
    }
    case "session-start": ui.sessionFlow = { bathers: state.spaProfile.regularBathers,
      sessionType: "Mixed use", duration: "15–30 min", temp: currentModeTemp(state) }; render(); break;
    case "sess-bathers": ui.sessionFlow.bathers = arg; render(); break;
    case "sess-type": ui.sessionFlow.sessionType = arg; render(); break;
    case "sess-dur": ui.sessionFlow.duration = arg; render(); break;
    case "sess-save": saveSession(); break;
    case "sess-cancel": ui.sessionFlow = null; render(); break;
    case "shock-done":
      addEvent(state, "shock", { productId: "aqua_shock" }, "", now);
      saveState(state); go("maintenance"); break;
    case "filter-rinse": addEvent(state, "filter_rinse", {}, "", now); saveState(state); render(); break;
    case "filter-clean": addEvent(state, "filter_clean", {}, "", now); saveState(state); render(); break;
    case "filter-replace": addEvent(state, "filter_replace", {}, "", now); saveState(state); render(); break;
    case "mode-switch": {
      const to = state.operatingMode === "summer_swim" ? "hot_soak" : "summer_swim";
      addEvent(state, "mode_change", { from: state.operatingMode, to: to }, "", now);
      state.operatingMode = to;
      saveState(state); render(); break;
    }
    case "ozone-toggle":
      state.ozone.enabled = !state.ozone.enabled;
      addEvent(state, "ozone_change", { enabled: state.ozone.enabled }, "", now);
      saveState(state); render(); break;
    // Fresh fill.
    case "freshfill-start": setStartupState("refill"); go("freshfill"); break;
    case "ff-circulating": ffCirculating(); break;
    case "ff-initial-test": startTest("full", null, "fresh_fill", ffAfterInitialTest); break;
    case "ff-retest": ffRetest(el.getAttribute("data-param")); break;
    case "ff-added": {
      const prod = findChemical(state, el.getAttribute("data-product"));
      addEvent(state, "chemical_added", { parameter: el.getAttribute("data-param"),
        productId: prod ? prod.id : null, productName: prod ? prod.name : "chemical" }, "", now);
      saveState(state);
      alert2("Logged. Circulate according to the chemical label, then retest.");
      render(); break;
    }
    case "ff-advance": setStartupState(arg); render(); break;
    case "ff-skip": setStartupState(arg); render(); break;
    case "ff-final-test": ffFinalTest(); break;
    case "ff-finish": ffFinish(); break;
    // Water change.
    case "wc-start": {
      addEvent(state, "drain_started", { previousWaterAgeDays: waterAgeDays(state, now) }, "", now);
      saveState(state);
      ui.waterChange = { step: 0 }; render(); break;
    }
    case "wc-next": ui.waterChange.step += 1; render(); break;
    case "wc-refill": ui.waterChange = null; setStartupState("refill"); go("freshfill"); break;
    case "wc-cancel": ui.waterChange = null; render(); break;
    // History.
    case "hist-tab": ui.historyTab = arg; render(); break;
    case "trend-range": ui.trendRange = arg; render(); break;
    case "toggle-markers": state.settings.showEventMarkers = !state.settings.showEventMarkers; saveState(state); render(); break;
    case "note-save": {
      const txt = str("note-text", "");
      if (txt) { addEvent(state, "note", {}, txt, now); saveState(state); render(); }
      break;
    }
    // Settings.
    case "set-spa":
      state.settings.spaName = str("s-name", state.settings.spaName);
      state.spaProfile.volumeGallons = num("s-gal", state.spaProfile.volumeGallons);
      state.spaProfile.volumeLitres = num("s-lit", state.spaProfile.volumeLitres);
      state.settings.modeTemps.summer_swim = num("s-temp-summer", state.settings.modeTemps.summer_swim);
      state.settings.modeTemps.hot_soak = num("s-temp-soak", state.settings.modeTemps.hot_soak);
      saveState(state); alert2("Saved."); render(); break;
    case "set-targets":
      state.targets.freeChlorine.min = num("t-fc-min", 3); state.targets.freeChlorine.max = num("t-fc-max", 5);
      state.targets.pH.min = num("t-ph-min", 7.2); state.targets.pH.max = num("t-ph-max", 7.8);
      state.targets.alkalinity.min = num("t-alk-min", 80); state.targets.alkalinity.max = num("t-alk-max", 120);
      state.targets.hardness.min = num("t-hd-min", 150); state.targets.hardness.max = num("t-hd-max", 250);
      state.targets.cya.preferredMin = num("t-cya-pref-min", 20); state.targets.cya.preferredMax = num("t-cya-pref-max", 50);
      state.targets.cya.caution = num("t-cya-caution", 100); state.targets.cya.high = num("t-cya-high", 150);
      saveState(state); alert2("Saved."); render(); break;
    case "set-intervals": {
      const iv = state.maintenance.intervals;
      iv.shockDays = num("i-shock", iv.shockDays);
      iv.filterRinseDays = num("i-rinse", iv.filterRinseDays);
      iv.filterCleanDays = num("i-clean", iv.filterCleanDays);
      iv.filterReplaceMonths = num("i-repl", iv.filterReplaceMonths);
      iv.waterChangeDays = num("i-water", iv.waterChangeDays);
      iv.quickTestDays = num("i-quick", iv.quickTestDays);
      iv.fullTestDays = num("i-full", iv.fullTestDays);
      saveState(state); alert2("Saved."); render(); break;
    }
    case "chem-edit": ui.editingChem = arg; render(); break;
    case "chem-cancel": ui.editingChem = null; render(); break;
    case "chem-save": {
      const c = state.chemicalInventory.find(x => x.id === arg);
      if (c) {
        c.notes = str("c-notes", "");
        const dose = num("c-dose", 0), vol = num("c-vol", 0);
        c.dosing = (dose > 0 && vol > 0) ? { labelDose: dose, unit: str("c-unit", "g"), referenceVolume: vol } : null;
      }
      ui.editingChem = null; saveState(state); render(); break;
    }
    case "export": exportData(); break;
    case "reset":
      if (ui._confirmReset) {
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState(); ui._confirmReset = false; go("today");
      } else {
        ui._confirmReset = true;
        el.textContent = "TAP AGAIN TO CONFIRM RESET";
        setTimeout(() => { ui._confirmReset = false; if (document.body.contains(el)) el.textContent = "RESET APP"; }, 4000);
      }
      break;
  }
}

/* ============================================================
   10. APP INITIALIZATION — guarded so the chemistry engine can be
   loaded under Node (tests) without a DOM.
   ============================================================ */
if (typeof document !== "undefined" && document.getElementById) {
  state = loadState();
  document.addEventListener("click", function (e) {
    const el = e.target.closest && e.target.closest("[data-act]");
    if (el) handleAction(el.getAttribute("data-act"), el);
  });
  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "import-file" && e.target.files && e.target.files[0]) {
      importData(e.target.files[0]);
    }
  });
  // Reopening mid fresh-fill resumes the wizard instead of Today.
  ui.route = state.startup.active ? "freshfill" : "today";
  render();
}
</script>
</body>
</html>
